      gen:["إخطار ولي أمر الطالب الغائب يومياً من قبل إدارة المدرسة بغياب نفس اليوم باستخدام جميع الوسائل المتاحة، مع توثيق ذلك في سجلات الغياب ونظام نور.","المحافظة على سرية أعذار الغياب من قبل إدارة المدرسة.","عدم إشراك الموجّه الطلابي في إجراءات الحرمان أو حسم الدرجات على الطالب المتغيب بدون عذر.","توثيق رفض التعهد من قبل وكيل شؤون الطلبة حال رفض الطالب أو ولي أمره التوقيع، مع استكمال بقية الإجراءات.","عدم التأثير على درجة المواظبة حال تقديم عذر مقبول في الوقت المحدد.","تكليف الطالب باستكمال خطة التعلم الأسبوعية والفصلية سواء كان الغياب بعذر أو بدون عذر.","اعتبار انقطاع الطالب عن التعليم نوعاً من الإيذاء أو الإهمال، والتواصل مع ولي الأمر والاستفسار عن سبب الانقطاع، واتباع الإجراءات النظامية."],
      excT:"حالات الغياب والاستئذان بعذر", excH:["الحالة","الإثبات"],
      exc:[["الإجازة المرضية","تقرير إجازة مرضية من منصة صحتي"],["مراجعة المستشفيات والمراكز الصحية","إشعار مراجعة من منصة صحتي"],["حدوث الكوارث مثل الحريق وغيره","مشهد من الدفاع المدني"],["وفاة أحد الأقارب إلى الدرجة الثالثة","شهادة الوفاة"],["مرافقة صحية لأحد الأقارب من الدرجة الأولى","إشعار مرافقة"],["مرافقة صحية لأحد الأقارب إلى الدرجة الثالثة","إشعار مرافقة (تقدير العذر لإدارة المدرسة قبولاً أو رفضاً)"],["مراجعة الجهات الرسمية","إشعار مراجعة"],["مرافقة الأقارب من الدرجة الأولى للجهات الرسمية","إشعار مراجعة"],["المشاركات في المسابقات المحلية والدولية","مشهد المشاركة"],["ظروف صحية أخرى — تقيّم إدارة المدرسة حالات الطلبة ذوي الظروف الصحية والنفسية والأمراض المزمنة","تقرير طبي"],["ما تقرره الأنظمة واللوائح فيما يتعلق بحماية الطفل","—"]],
      dl:["تُعطى مهلة للطالب وولي أمره مدتها ثلاثة أيام عمل بعد الغياب لتقديم العذر.","في حال وجود مبرر مقبول يجوز قبول العذر بعد المهلة بشرط ألا يتجاوز التقديم عشرة أيام عمل.","لمدير المدرسة صلاحية تمديد القبول حتى نهاية الفصل الدراسي عند وجود مبرر، مع إرفاق ما يدعم القرار في نظام نور."],
      wexT:"الغياب بعذر — إجراءات التعامل عند التكرار",
      wex:[{d:"3 أيام", s:["تحويل الطالب للموجّه الطلابي لتقديم الدعم والخدمات التربوية المناسبة (خطة التعلم لأيام الغياب) ودراسة الحالة إذا احتاج الأمر.","استدعاء ولي الأمر وعقد اجتماع حضوري معه يتضمن إبلاغه بالإجراءات المترتبة على غياب ابنه، وتقييم الخدمات التربوية والخطة العلاجية وتحديثها بما يلزم."]},
           {d:"5 أيام", s:["في حال عدم التزام ولي الأمر بالخطة التربوية (خطة التعلم لأيام الغياب) تُحال حالة الطالب إلى لجنة التوجيه الطلابي، وتُنظَّم جلسة توعوية مع ولي الأمر للتأكيد على أهمية اتباع الخطط التربوية والعلاجية."]},
           {d:"10 أيام", s:["في حال الاشتباه بتعرض الطالب للإهمال تخاطب المدرسة الجهات ذات الاختصاص حيال تطبيق ما ورد في نظام حماية الطفل ونظام الحماية من الإيذاء ولائحتيهما التنفيذية، وإشعار إدارة التعليم بذلك.","تتخذ المدرسة الإجراءات النظامية المطلوبة بالتنسيق والمتابعة مع الجهات المذكورة."]}],
      nexT:"الغياب بدون عذر — إجراءات التعامل",
      nexLead:"يُتواصل مع ولي الأمر في نفس اليوم الذي غاب فيه الطالب من خلال الرسالة النصية أو المكالمة الهاتفية للاستفسار عن سبب الغياب.",
      nex:[{d:"3 أيام", s:["تحويل الطالب للموجّه الطلابي لدراسة الحالة وتقديم الخدمات التربوية المناسبة له.","عند استمرار الغياب يُستدعى ولي الأمر ويُعقد اجتماع حضوري يتضمن: إبلاغه بالإجراءات المترتبة على غياب ابنه، وتقييم الخدمات التربوية والخطة العلاجية وتحديثها، وأخذ التعهد الخطي من الطالب وولي الأمر بالالتزام بالخطة المقدمة.","استمرار تقديم الخدمات التربوية للطالب ومتابعة حالته.","حال كانت أيام الغياب متصلة (3 أيام أو أكثر) تخاطب المدرسة الجهات ذات الاختصاص حيال تطبيق ما ورد في نظام حماية الطفل ونظام الحماية من الإيذاء ولائحتيهما التنفيذية."]},
           {d:"5 أيام", s:["استدعاء ولي الأمر لمناقشة أسباب الغياب.","إحالة الطالب للجنة التوجيه الطلابي، وعقد اجتماع لمراجعة الخطة التربوية والعلاجية المقدمة للطالب وتحديثها بما يلزم.","استمرار تقديم الخدمات التربوية للطالب ومتابعة حالته.","تنبيه ولي الأمر بالإجراءات المترتبة على استمرار غياب ابنه."]},
           {d:"10 أيام", s:["مخاطبة الجهات ذات الاختصاص من قبل المدرسة حيال تطبيق ما ورد في نظام حماية الطفل ونظام الحماية من الإيذاء ولائحتيهما التنفيذية، مع إشعار إدارة التعليم بذلك.","متابعة الإجراءات والتنسيق من قبل المدرسة بعد اتخاذ الإجراءات النظامية المطلوبة مع الجهات ذات الاختصاص، حيال ما تم من إجراءات للحالات المحالة لهم."]}],
      warn:"استمرارية تقديم الخدمات التعليمية وعدم التسبب في انقطاع الطالب أمر واجب في جميع الحالات."},
  en:{h:"Attendance", lead:"Rules on absence and leave, and the procedures applied to absent students.",
      genT:"General provisions",
      gen:["The school notifies the guardian of the same day's absence, using every available means, and documents it in the absence records and the Noor system.","The school keeps absence excuses confidential.","The counsellor takes no part in denial-of-promotion or mark-deduction procedures for unexcused absence.","If the student or guardian refuses to sign the pledge, the student affairs deputy documents the refusal and the remaining procedures continue.","An acceptable excuse submitted within the deadline does not affect the attendance mark.","The student completes the weekly and termly learning plan whether the absence was excused or not.","A student's disengagement from education is treated as a form of abuse or neglect: the guardian is contacted, the reason established, and the statutory procedures followed."],
      excT:"Excused absence and leave", excH:["Case","Evidence"],
      exc:[["Medical leave","Sick-leave report from the Sehhaty platform"],["Hospital or health centre appointment","Appointment notice from Sehhaty"],["Disasters such as fire","Civil Defence statement"],["Death of a relative up to the third degree","Death certificate"],["Accompanying a first-degree relative for medical care","Companion notice"],["Accompanying a relative up to the third degree for medical care","Companion notice (accepted or refused at the school's discretion)"],["Appointment with a government authority","Appointment notice"],["Accompanying a first-degree relative to a government authority","Appointment notice"],["Participation in local or international competitions","Participation certificate"],["Other health circumstances — the school assesses students with health or psychological conditions and chronic illness","Medical report"],["Whatever the child-protection rules and regulations provide","—"]],
      dl:["The student and guardian have three working days after the absence to submit the excuse.","With an acceptable justification, an excuse may be accepted later, provided it is submitted within ten working days.","The principal may extend acceptance to the end of the term where a justification exists, attaching supporting evidence in the Noor system."],
      wexT:"Repeated excused absence — procedures",
      wex:[{d:"3 days", s:["Referral to the counsellor for support and suitable educational services (the learning plan for the days missed), and case study if needed.","The guardian is summoned to an in-person meeting: informed of what continued absence entails, and the educational services and remedial plan are reviewed and updated as needed."]},
           {d:"5 days", s:["If the guardian does not follow the educational plan, the case is referred to the guidance committee and an awareness session is held with the guardian on the importance of following the educational and remedial plans."]},
           {d:"10 days", s:["Where neglect is suspected, the school contacts the competent authorities regarding the Child Protection Law and the Protection from Abuse Law and their executive regulations, and notifies the Education Directorate.","The school takes the required statutory measures in coordination with those authorities."]}],
      nexT:"Unexcused absence — procedures",
      nexLead:"The guardian is contacted the same day, by text message or phone call, to establish the reason for the absence.",
      nex:[{d:"3 days", s:["Referral to the counsellor for case study and suitable educational services.","If the absence continues, the guardian is summoned to an in-person meeting: informed of what continued absence entails; the educational services and remedial plan are reviewed and updated; and the student and guardian sign a pledge to follow the plan.","Educational services continue and the case is followed up.","If the days are consecutive (three or more), the school contacts the competent authorities regarding the Child Protection Law and the Protection from Abuse Law and their executive regulations."]},
           {d:"5 days", s:["The guardian is summoned to discuss the reasons for the absence.","The case is referred to the guidance committee, which meets to review and update the educational and remedial plan.","Educational services continue and the case is followed up.","The guardian is warned of what continued absence entails."]},
           {d:"10 days", s:["The school contacts the competent authorities regarding the Child Protection Law and the Protection from Abuse Law and their executive regulations, and notifies the Education Directorate.","The school follows up and coordinates with those authorities on the measures taken for referred cases."]}],
      warn:"Educational services must continue in every case, and nothing may cause the student to disengage from education."}},

 digital:{
  ar:{h:"آداب السلوك الرقمي في المنصة الرقمية", lead:"المادة (18) — ما يلتزم به الطالب في التعليم الإلكتروني.",
      aT:"الحضور والانصراف",
      a:["حضور فصول منصات التعليم الإلكترونية المعتمدة في الوقت المحدد.","الانصراف بعد انتهاء وقت الحصة والانتقال للحصة الأخرى.","تجنب فتح أكثر من نافذة رقمية أثناء الحصة منعاً للتشتت وتفادياً لبطء جهاز الحاسب الآلي."],
      bT:"المشاركة الصفية",
      b:["احترام مشاركات الطلبة والتعامل معهم بلطف، وتقبل النقد البنّاء من الآخرين.","الابتعاد عن نطق أو كتابة الألفاظ البذيئة، أو إرسال وسائط مخلة بالآداب، أو عبارات تحفز على العنصرية والطائفية والقبلية، والتشهير والإساءة واللمز والانتقاص من الآخرين ومجهوداتهم.","رفض أي شكل من أشكال التنمر الإلكتروني على المعلمين أو الطلبة، سواء على الأسماء أو الصور أو الألقاب أو المشاركات الصفية.","عدم تسجيل أو تصوير ما يحدث داخل الفصل ونشره في أي وسيلة من وسائل التواصل الاجتماعي.","الاستئذان قبل المشاركة الإلكترونية برفع اليد من خلال البرنامج، والحديث بعد الاستئذان من المعلم.","إغلاق مكبر الصوت أو الكاميرا، وعدم فتحهما إلا بإذن المعلم.","ارتداء الملابس اللائقة والرسمية عند المشاركة من خلال الكاميرا مع مراعاة الذوق العام.","التأكد من الملفات المرفوعة مسبقاً قبل مشاركتها في الحصة الافتراضية.","مراعاة استخدام اللغة العربية وقواعد الإملاء وصحة الكتابة في المشاركة الإلكترونية.","الابتعاد عن إرسال الصور أو الملصقات التعبيرية والاختصارات المستحدثة أثناء الحصة دون إذن المعلم."]},
  en:{h:"Digital conduct on the platform", lead:"Article 18 — what the student is expected to observe in online learning.",
      aT:"Attendance and departure",
      a:["Joining classes on the approved platforms on time.","Leaving when the lesson ends and moving to the next class.","Avoiding multiple open windows during the lesson, to prevent distraction and device slowdown."],
      bT:"Classroom participation",
      b:["Respecting other students' contributions, being courteous, and accepting constructive criticism.","Avoiding foul language spoken or written, indecent media, or statements inciting racism, sectarianism or tribalism, defamation, insults, insinuation or belittling others and their efforts.","Rejecting cyberbullying of teachers or students in any form — names, images, nicknames or classroom contributions.","Not recording or filming what happens in class, or publishing it on any social platform.","Raising a hand in the application before contributing, and speaking only after permission.","Keeping the microphone and camera off, and turning them on only with the teacher's permission.","Wearing appropriate, formal clothing when appearing on camera, with due regard to public decency.","Checking previously uploaded files before sharing them in the virtual class.","Using Arabic correctly, with proper spelling and writing, in online contributions.","Not sending images, emoji stickers or invented abbreviations during the lesson without the teacher's permission."]}},

 abuse:{
  ar:{h:"التعامل مع حالات الإيذاء أو الإهمال", lead:"المادة (29) — إجراءات عاجلة لا تتطلب التدرج، تُتخذ وفق درجة خطورة الحالة.",
      items:["عند اكتشاف حالة إيذاء جسدي أو نفسي أو جنسي أو إهمال — أو وجود اشتباه بخطر محدد — من قبل أحد منسوبي المدرسة تجاه أحد الطلاب، سواء من الأسرة أو من داخل المدرسة، يُبلَّغ مدير/ة المدرسة فوراً وبشكل سري.","إحالة الحالة إلى لجنة التوجيه الطلابي بالمدرسة للتثبت منها ودراستها وتقييم درجة خطورتها (شديدة / متوسطة / بسيطة) وتحديد مستوى الخدمة اللازمة (عاجلة / غير عاجلة)، مع استمرار الدعم النفسي والاجتماعي وتصميم خطة تدخل مناسبة لحمايتها.","تدوين محضر رسمي من إدارة المدرسة لإثبات الواقعة.","استدعاء ولي أمر الطالب وإبلاغه، ويُراعى في ذلك رغبة الطالب في تحديد الشخص المناسب إذا كان ولي الأمر غير مؤهل أو هو من قام بالإيذاء.","التنسيق الفوري مع أقرب مركز صحي عند وجود آثار جسدية واضحة لتقييم الحالة طبياً وإعداد تقرير طبي.","إبلاغ مركز بلاغات وزارة الموارد البشرية والتنمية الاجتماعية (1919) فوراً في حال تطلبت الحالة تدخلاً عاجلاً، بالإضافة إلى إبلاغ الجهات الأمنية إذا اقتضى الأمر.","رفع الحالة إلى الجهات المختصة في إدارة التعليم إذا كان مصدر الإيذاء أحد منسوبي المدرسة.","الاستمرار في تقديم الرعاية والدعم النفسي والاجتماعي قبل الإبلاغ وبعده، ومتابعة تنفيذ خطة التأهيل حتى استقرار الحالة."],
      tipsT:"ملحوظات تربوية مهمة",
      tips:["التحلي بالهدوء والتعامل بحكمة واتزان عند اكتشاف الحالة.","التأكد من أن أي إجراء يُتخذ لا يتسبب في إلحاق ضرر أكبر بالحالة.","المبادرة بالتبليغ إلى مركز البلاغات (1919) من قبل منسوبي المدرسة عند ملاحظة وجود تراخٍ من إدارة المدرسة تجاه الحالة."]},
  en:{h:"Handling abuse or neglect", lead:"Article 29 — urgent procedures that do not follow the graduated sequence and are applied according to the severity of the case.",
      items:["When a staff member discovers physical, psychological or sexual abuse or neglect — or suspects a specific danger — whether from the family or within the school, the principal is informed immediately and confidentially.","The case is referred to the school guidance committee to verify and study it, assess its severity (severe / moderate / minor) and the level of service required (urgent / non-urgent), while psychological and social support continues and a protection plan is designed.","The school draws up an official incident report.","The guardian is summoned and informed — taking the student's preference into account where the guardian is unsuitable or is the source of the abuse.","Immediate coordination with the nearest health centre where visible physical marks exist, for medical assessment and a medical report.","The Ministry of Human Resources and Social Development Reporting Centre (1919) is notified immediately where urgent intervention is required, along with security authorities if necessary.","The case is escalated to the competent bodies at the Education Directorate if the source of the abuse is a school staff member.","Care and psychological and social support continue before and after reporting, and the rehabilitation plan is followed until the case stabilises."],
      tipsT:"Important notes",
      tips:["Stay calm and act with measured judgement on discovering the case.","Make sure no measure taken causes further harm to the student.","Staff should report to the Reporting Centre (1919) themselves if they observe any laxity from the school administration."]}},

 roles:{
  ar:{h:"الأدوار والمسؤوليات",
      groups:[
       {t:"دور إدارة المدرسة", i:["تطبيق ما ورد في الدليل التنظيمي لمدارس التعليم العام فيما يخص التوجيه الطلابي.","إعداد خطة إجرائية لتفعيل قواعد السلوك والمواظبة تستهدف الهيئة التعليمية والإدارية والطلبة وأولياء الأمور.","عقد مجلس أولياء الأمور للتأكيد على دور الأسرة في تعزيز القيم والسلوك الإيجابي.","توثيق ورصد درجات السلوك وتحديثها وفق ما يطرأ عليها، وتسجيلها في نظام نور.","توثيق المشكلات السلوكية والإجراءات المتخذة حيالها، وتوثيق الغياب وحسم درجات المواظبة يومياً.","إطلاع منسوبي المدرسة وأولياء الأمور على اللائحة التنفيذية لنظامي الحماية من الإيذاء وحماية الطفل، وأخذ توقيعاتهم.","حصر وتحديث ومتابعة بيانات الطلبة المعرضين للإيذاء والإهمال واتخاذ الإجراء المناسب."]},
       {t:"دور لجنة التوجيه الطلابي", i:["دراسة سلوك الطلبة ومواظبتهم على مستوى المدرسة، والعمل على تعزيز السلوك الإيجابي ومعالجة السلبي.","دراسة أبرز مشكلات الطلبة ووضع الخطط الوقائية والعلاجية لها بالتنسيق مع الأسرة ومنسوبي المدرسة.","استقبال الشواهد التي تثبت قيام الطالب بممارسات السلوك المتميز وتقدير الدرجة المستحقة والاحتفاظ بها في ملفه.","تقدير أي سلوك متميز لم يُذكر في الممارسات المقترحة، بما لا يزيد عن خمس درجات.","توفير فرص تحسين درجات السلوك وتقدير الدرجات التعويضية المستحقة.","تصنيف المشكلات السلوكية التي لم ترد في القواعد حسب حدتها وملابساتها، بما لا يتجاوز الدرجة الثالثة.","دراسة المشكلات السلوكية والحالات عالية الخطورة وتقدير الإجراءات، وإعداد المحاضر ورفع التوصيات لمدير المدرسة.","إحالة مشكلات الطلبة السلوكية والنفسية والاجتماعية للجهات ذات العلاقة."]},
       {t:"دور الموجّه الطلابي", i:["تعزيز القيم الإسلامية والانتماء والمواطنة، وتعزيز التنوع الثقافي والوسطية والاعتدال الفكري.","تعزيز قيم التعامل الرقمي لدى الطلبة والمساهمة في توفير بيئة تعليمية آمنة وجاذبة.","تطبيق فنيات الإرشاد النفسي وأساليب تعديل السلوك لمساعدة الطلبة، ومراعاة خصائص واحتياجات نموهم.","حصر وتحديث ومتابعة المشكلات السلوكية والحالات الخاصة (تربوية، نفسية، اجتماعية، صحية) وتخطيط التدخلات المناسبة.","توعية الطلبة المخالفين سلوكياً بحقهم في فرص تعويض درجات السلوك الإيجابي.","متابعة حالات الطلبة متكرري الغياب واتخاذ الإجراءات التصحيحية بالتنسيق مع وكيل شؤون الطلبة.","توعية أولياء الأمور بأهمية دورهم في متابعة ومنع مشكلات أبنائهم السلوكية والدراسية."]},
       {t:"دور الأسرة", i:["تعزيز القيم الإسلامية والانتماء والمواطنة لدى الأبناء، وتعزيز السلوك الإيجابي والانضباط الذاتي.","الاطلاع على جميع أنظمة المدرسة وقواعدها وتعليماتها ومناقشتها مع الأبناء.","حضور الاجتماعات ومجالس أولياء الأمور والفعاليات التثقيفية والتوعوية التي تنفذها إدارة المدرسة.","الالتزام بالمسؤولية الكاملة تجاه الابن وفق ما ورد في القواعد وفي نظامي الحماية من الإيذاء وحماية الطفل.","تأمين المتطلبات المدرسية ومستلزماتها ومتطلبات التعليم الإلكتروني.","متابعة الأبناء وتوجيههم نحو التفاعل الرقمي المسؤول في ظل الانفتاح الإعلامي.","غرس قيمة الانضباط من خلال الحرص على الحضور المدرسي المنتظم والالتزام بحضور الحصص.","التواصل الفوري مع المدرسة عند غياب الابن مع توضيح سببه.","إخطار المدرسة باحتياجات الابن والتعاون معها في حل المشكلات السلوكية التي قد يعاني منها.","إبلاغ الموجّه الطلابي أو الوكيل عند تعرض الأبناء لمشكلات سلوكية لتوثيق الحالة واتخاذ الإجراءات اللازمة."]}]},
  en:{h:"Roles and responsibilities",
      groups:[
       {t:"The school administration", i:["Applying the organisational guide for general education schools in respect of student guidance.","Preparing an action plan to activate the rules, targeting teaching and administrative staff, students and guardians.","Convening the parents' council to affirm the family's role in reinforcing values and positive behaviour.","Documenting, recording and updating conduct marks and entering them in the Noor system.","Documenting violations and the procedures taken, and recording absence and attendance deductions daily.","Familiarising staff and guardians with the executive regulations of the Protection from Abuse and Child Protection Laws, and obtaining their signatures.","Identifying, updating and following up data on students exposed to abuse and neglect, and taking suitable action."]},
       {t:"The student guidance committee", i:["Studying student behaviour and attendance across the school, reinforcing positive behaviour and remedying negative behaviour.","Studying the main student problems and setting preventive and remedial plans with the family and school staff.","Receiving evidence of distinguished conduct, assessing the marks due, and keeping it in the student's file.","Assessing distinguished conduct not covered by the suggested practices, up to five marks.","Providing opportunities to improve conduct marks and assessing the compensatory marks due.","Classifying violations not covered by the rules according to their severity, up to Level Three.","Studying violations and high-risk cases, assessing procedures, drawing up minutes and submitting recommendations to the principal.","Referring behavioural, psychological and social problems to the relevant bodies."]},
       {t:"The student counsellor", i:["Reinforcing Islamic values, belonging and citizenship, cultural diversity, moderation and intellectual balance.","Reinforcing responsible digital conduct and helping provide a safe, welcoming learning environment.","Applying counselling techniques and behaviour modification methods, with regard to students' developmental characteristics and needs.","Identifying, updating and following up violations and special cases (educational, psychological, social, health) and planning suitable interventions.","Informing students who have violated the rules of their right to recover positive conduct marks.","Following up frequently absent students and taking corrective measures with the student affairs deputy.","Raising guardians' awareness of their role in following up and preventing behavioural and academic problems."]},
       {t:"The family", i:["Reinforcing Islamic values, belonging and citizenship, positive behaviour and self-discipline.","Reading all school rules, regulations and instructions and discussing them with the children.","Attending meetings, parents' councils and the awareness events the school runs.","Taking full responsibility for the child under these rules and under the Protection from Abuse and Child Protection Laws.","Providing school requirements and the equipment needed for online learning.","Following up children and guiding them toward responsible digital interaction in an open media environment.","Instilling discipline by ensuring regular school attendance and attendance at every lesson.","Contacting the school immediately when the child is absent and explaining the reason.","Informing the school of the child's needs and cooperating in resolving any behavioural difficulties.","Informing the counsellor or the deputy when children face behavioural problems, so the case is documented and action taken."]}]}}
};

/* ============================ RENDER ============================ */
let L = "ar";
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!==undefined)e.innerHTML=h; return e;};
const sec = (id,eyebrow,title,lead)=>{
  const s=el("section"); s.id=id;
  if(eyebrow) s.appendChild(el("div","eyebrow",eyebrow));
  s.appendChild(el("h2",null,title));
  if(lead) s.appendChild(el("p","lead",lead));
  return s;
};
const list=(items,cls)=>{const u=el("ul",cls||"tick"); items.forEach(i=>u.appendChild(el("li",null,i))); return u;};
const olist=items=>{const o=el("ol","num"); items.forEach(i=>o.appendChild(el("li",null,i))); return o;};
const table=(head,rows)=>{
  const t=el("table"); const tr=el("tr"); head.forEach(h=>tr.appendChild(el("th",null,h)));
  t.appendChild(el("thead")).appendChild(tr);
  const tb=el("tbody");
  rows.forEach(r=>{const x=el("tr"); r.forEach(c=>x.appendChild(el("td",null,c))); tb.appendChild(x);});
  t.appendChild(tb); return t;
};

function render(){
  const ui=UI[L], main=document.getElementById("main");
  document.documentElement.lang=L;
  document.documentElement.dir = L==="ar" ? "rtl" : "ltr";
  document.getElementById("hdTitle").textContent=ui.title;
  const hs=document.getElementById("hdSub"); hs.textContent=ui.sub; hs.hidden=!ui.sub;
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.set===L));
  const ids=["overview","marks","general","violations","attendance","digital","abuse","roles"];
  const nav=document.getElementById("navList"); nav.innerHTML="";
  ui.nav.forEach((n,i)=>{
    const li=el("li"); const a=el("a",null,n);
    a.setAttribute("role","link"); a.tabIndex=0;
    const go=e=>{e.preventDefault(); const t=document.getElementById(ids[i]);
      if(t) t.scrollIntoView({behavior:"smooth",block:"start"});};
    a.addEventListener("click",go);
    a.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")go(e);});
    li.appendChild(a); nav.appendChild(li);});
  document.getElementById("foot").innerHTML =
    '<div><b>'+ui.foot+'</b></div><div>'+ui.foot2+'</div>';

  main.innerHTML="";

  /* overview */
  {const d=DATA.overview[L]; const s=sec("overview",UI.en.nav[0],d.h,d.lead);
   const g=el("div","grid g2");
   const c1=el("div","card"); c1.appendChild(el("h4",null,d.goalsT)); c1.appendChild(list(d.goals));
   const c2=el("div","card"); c2.appendChild(el("h4",null,d.scopeT)); c2.appendChild(list(d.scope));
   g.append(c1,c2); s.appendChild(g); main.appendChild(s);}

  /* marks */
  {const d=DATA.marks[L]; const s=sec("marks",UI.en.nav[1],d.h);
   const g=el("div","grid g2");
   const c1=el("div","card");
   c1.appendChild(el("div","stat","<b>100</b><span>"+d.conduct+"</span>")); c1.appendChild(list(d.c));
   const c2=el("div","card");
   c2.appendChild(el("div","stat","<b>100</b><span>"+d.attend+"</span>")); c2.appendChild(list(d.a));
   g.append(c1,c2); s.appendChild(g);
   s.appendChild(el("h3",null,d.bonusT)); s.appendChild(table(d.bonusH,d.bonus));
   main.appendChild(s);}

  /* general */
  {const d=DATA.general[L]; const s=sec("general",UI.en.nav[2],d.h,d.lead);
   s.appendChild(olist(d.items));
   s.appendChild(el("h3",null,d.banT));
   const c=el("div","card"); c.appendChild(list(d.ban)); s.appendChild(c);
   main.appendChild(s);}

  /* violations */
  {const s=sec("violations",UI.en.nav[3], L==="ar"?"المشكلات السلوكية والإجراءات":"Violations and procedures", UI[L].grad);
   const tabs=el("div","tabs"); const holder=el("div");
   TRACKS.forEach((tr,ti)=>{
     const b=el("button",null,tr[L]); b.type="button"; b.setAttribute("aria-selected", ti===0);
     b.onclick=()=>{tabs.querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected",false));
       b.setAttribute("aria-selected",true); paint(ti);};
     tabs.appendChild(b);
   });
   function paint(ti){
     holder.innerHTML="";
     TRACKS[ti].levels.forEach(lv=>{
       const box=el("div","level"+(lv.sev?" sev":""));
       const hd=el("button","lv-hd"); hd.type="button";
       hd.innerHTML='<span class="lv-num">'+lv.n+'</span>'+
         '<span class="lv-t"><span class="lv-name">'+lv.name[L]+'</span><br>'+
         '<span class="lv-art">'+lv.art[L]+'</span></span>'+
         '<span class="chip">'+UI[L].deduct+': '+lv.ded[L]+'</span><span class="caret">▾</span>';
       hd.onclick=()=>box.classList.toggle("open");
       const body=el("div","lv-body");
       const cols=el("div","cols");
       const left=el("div"); left.appendChild(el("div","sub",UI[L].viol)); left.appendChild(list(lv.v[L]));
       const right=el("div"); right.appendChild(el("div","sub",UI[L].proc));
       lv.p.forEach(pr=>{const p=el("div","proc"); p.appendChild(el("h5",null,pr.t[L])); p.appendChild(olist(pr.s[L])); right.appendChild(p);});
       cols.append(left,right); body.appendChild(cols);
       if(lv.notes) body.appendChild(el("div","note", lv.notes[L].map(n=>"• "+n).join("<br>")));
       box.append(hd,body); holder.appendChild(box);
     });
     holder.firstChild.classList.add("open");
   }
   s.append(tabs,holder); main.appendChild(s); paint(0);}

  /* attendance */
  {const d=DATA.attendance[L]; const s=sec("attendance",UI.en.nav[4],d.h,d.lead);
   s.appendChild(el("h3",null,d.genT)); s.appendChild(list(d.gen));
   s.appendChild(el("h3",null,d.excT)); s.appendChild(table(d.excH,d.exc));
   const nd=el("div","note", d.dl.map(x=>"• "+x).join("<br>")); s.appendChild(nd);
   [["wexT","wex"],["nexT","nex"]].forEach(([tk,ik],idx)=>{
     s.appendChild(el("h3",null,d[tk]));
     if(idx===1) s.appendChild(el("p","lead",d.nexLead));
     const g=el("div","grid g3");
     d[ik].forEach(b=>{const c=el("div","card");
       c.appendChild(el("h4",null,b.d)); c.appendChild(list(b.s)); g.appendChild(c);});
     s.appendChild(g);
   });
   s.appendChild(el("div","warn",d.warn));
   main.appendChild(s);}

  /* digital */
  {const d=DATA.digital[L]; const s=sec("digital",UI.en.nav[5],d.h,d.lead);
   const g=el("div","grid g2");
   const c1=el("div","card"); c1.appendChild(el("h4",null,d.aT)); c1.appendChild(list(d.a));
   const c2=el("div","card"); c2.appendChild(el("h4",null,d.bT)); c2.appendChild(list(d.b));
   g.append(c1,c2); s.appendChild(g); main.appendChild(s);}

  /* abuse */
  {const d=DATA.abuse[L]; const s=sec("abuse",UI.en.nav[6],d.h,d.lead);
   s.appendChild(olist(d.items));
   s.appendChild(el("h3",null,d.tipsT));
   const c=el("div","card"); c.appendChild(list(d.tips)); s.appendChild(c);
   s.appendChild(el("div","warn","<b>1919</b> — "+(L==="ar"?"مركز البلاغات بوزارة الموارد البشرية والتنمية الاجتماعية":"Reporting Centre, Ministry of Human Resources and Social Development")));
   main.appendChild(s);}

  /* roles */
  {const d=DATA.roles[L]; const s=sec("roles",UI.en.nav[7],d.h);
   const g=el("div","grid g2");
   d.groups.forEach(gr=>{const c=el("div","card"); c.appendChild(el("h4",null,gr.t)); c.appendChild(list(gr.i)); g.appendChild(c);});
   s.appendChild(g); main.appendChild(s);}

}

document.querySelectorAll(".langs button").forEach(b=>{
  b.addEventListener("click",()=>{L=b.dataset.set; render(); window.scrollTo({top:0,behavior:"instant"});});
});
render();
</script>
</body>
</html>

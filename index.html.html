<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قواعد السلوك والمواظبة — أكاديمية نهضة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Jost:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#7F2345; --deep:#4E1229; --rose:#B97A8E; --blush:#F2E6EB;
  --paper:#FBF8F9; --card:#FFFFFF; --ink:#231419; --muted:#6E5A61; --rule:#E5D6DB;
  --ar-d:"Noto Kufi Arabic","Segoe UI",sans-serif;
  --ar-b:"IBM Plex Sans Arabic","Segoe UI",sans-serif;
  --en-d:"Jost","Century Gothic",sans-serif;
  --en-b:"IBM Plex Sans",Arial,sans-serif;
  --d:var(--ar-d); --b:var(--ar-b);
}
html[dir="ltr"]{--d:var(--en-d); --b:var(--en-b);}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--b);font-size:15px;line-height:1.7}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(251,248,249,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:18px;padding:12px 0}
.bar img{height:52px}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--d);font-size:19px;font-weight:700;color:var(--maroon);line-height:1.3}
.brand p{font-size:12.5px;color:var(--muted)}
.langs{display:flex;border:1px solid var(--maroon);border-radius:999px;overflow:hidden;flex:0 0 auto}
.langs button{background:none;border:0;padding:7px 16px;cursor:pointer;font-size:13px;
  font-family:var(--b);color:var(--maroon)}
.langs button[aria-pressed="true"]{background:var(--maroon);color:#fff}
nav{border-top:1px solid var(--rule);overflow-x:auto}
nav ul{display:flex;gap:4px;list-style:none;padding:6px 0;white-space:nowrap}
nav a{text-decoration:none;font-size:13px;color:var(--muted);padding:6px 11px;border-radius:6px;display:block;cursor:pointer;user-select:none}
nav a:hover,nav a:focus{background:var(--blush);color:var(--maroon)}

/* sections */
section{padding:42px 0 6px;scroll-margin-top:130px}
.eyebrow{font-family:var(--en-d);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--rose);margin-bottom:6px}
h2{font-family:var(--d);font-size:25px;font-weight:700;color:var(--maroon);line-height:1.3;margin-bottom:8px}
h3{font-family:var(--d);font-size:17px;font-weight:600;color:var(--deep);margin:22px 0 10px}
.lead{color:var(--muted);max-width:70ch;margin-bottom:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
.card h4{font-family:var(--d);font-size:15.5px;font-weight:600;color:var(--deep);margin-bottom:6px}
.card p,.card li{font-size:13.8px;color:var(--muted)}
.stat{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.stat b{font-family:var(--en-d);font-weight:300;font-size:38px;color:var(--maroon);line-height:1}
.stat span{font-family:var(--d);font-weight:600;font-size:15px;color:var(--deep)}
ul.tick{list-style:none}
ul.tick li{position:relative;padding-inline-start:18px;margin-bottom:6px;font-size:14px;color:var(--muted)}
ul.tick li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:6px;height:6px;
  border-radius:50%;background:var(--rose)}
ol.num{list-style:none;counter-reset:n}
ol.num li{counter-increment:n;position:relative;padding-inline-start:30px;margin-bottom:8px;font-size:14px;color:var(--muted)}
ol.num li::before{content:counter(n);position:absolute;inset-inline-start:0;top:.15em;width:20px;height:20px;
  border-radius:50%;background:var(--blush);color:var(--maroon);font-size:11.5px;
  display:flex;align-items:center;justify-content:center;font-family:var(--en-d)}

table{width:100%;border-collapse:collapse;font-size:13.8px;background:var(--card);
  border:1px solid var(--rule);border-radius:10px;overflow:hidden}
th{background:var(--maroon);color:#fff;font-weight:600;text-align:start;padding:10px 14px;font-size:13.5px}
td{padding:10px 14px;border-top:1px solid var(--rule);color:var(--muted);vertical-align:top}
td:first-child{color:var(--deep);font-weight:600}

.note{background:var(--blush);border-inline-start:4px solid var(--maroon);
  padding:14px 18px;border-radius:8px;font-size:14px;color:var(--deep);margin-top:16px}
.warn{background:var(--deep);color:#fff;padding:16px 20px;border-radius:10px;margin-top:16px;font-size:14.5px}
.warn b{color:#F3D9E1}

/* tracks */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
.tabs button{font-family:var(--b);font-size:13.5px;padding:9px 15px;border-radius:999px;cursor:pointer;
  border:1px solid var(--rule);background:var(--card);color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--maroon);border-color:var(--maroon);color:#fff}

.level{border:1px solid var(--rule);border-radius:12px;background:var(--card);margin-bottom:16px;overflow:hidden}
.lv-hd{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--blush);cursor:pointer;
  border:0;width:100%;text-align:start;font-family:var(--b)}
.level.sev .lv-hd{background:var(--maroon)}
.level.sev .lv-hd .lv-name,.level.sev .lv-hd .lv-art{color:#fff}
.level.sev .lv-hd .lv-art{color:#EBCBD6}
.level.sev .chip{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.35)}
.lv-num{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--maroon);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:var(--en-d);font-size:18px}
.level.sev .lv-num{background:#fff;color:var(--maroon)}
.lv-t{flex:1;min-width:0}
.lv-name{font-family:var(--d);font-weight:600;font-size:16px;color:var(--deep)}
.lv-art{font-size:12px;color:var(--muted)}
.chip{flex:0 0 auto;font-family:var(--en-d);font-size:13px;padding:5px 12px;border-radius:999px;
  background:#fff;border:1px solid var(--rule);color:var(--maroon)}
.caret{flex:0 0 auto;color:var(--maroon);font-size:13px}
.level.sev .caret{color:#fff}
.lv-body{padding:18px 20px;display:none}
.level.open .lv-body{display:block}
.cols{display:grid;gap:22px;grid-template-columns:minmax(240px,1fr) minmax(280px,1.35fr)}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.sub{font-family:var(--en-d);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--rose);margin-bottom:9px}
.proc{border-inline-start:2px solid var(--rule);padding-inline-start:16px;margin-bottom:16px}
.proc h5{font-family:var(--d);font-size:14.5px;font-weight:600;color:var(--maroon);margin-bottom:6px}

footer{margin-top:52px;background:var(--deep);color:#EBD5DC;padding:30px 0;font-size:13.5px}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center}
footer b{color:#fff}

[hidden]{display:none !important}
@media print{
  header{position:static}nav,.tabs,.langs,.caret{display:none}
  .lv-body{display:block !important}
  body{font-size:11px}section{padding:16px 0 0;break-inside:avoid}
  .level{break-inside:avoid}
}
</style>
</head>

   p:[{t:{ar:"الإجراء الأول",en:"First procedure"},s:{ar:["التنبيه الشفهي الأول من المعلم أو إدارة المدرسة عن السلوك والأضرار المترتبة عليه، وكونه سلوكاً غير مرغوب فيه، بأسلوب تربوي حكيم."],en:["A first verbal warning from the teacher or administration explaining the behaviour, its consequences, and that it is unwanted — delivered in a considered educational manner."]}},
      {t:{ar:"الإجراء الثاني",en:"Second procedure"},s:{ar:["التنبيه الشفهي الثاني من المعلم أو إدارة المدرسة عند مباشرة الموقف بأسلوب تربوي حكيم، وتعزيز السلوك الإيجابي.","تهيئة الطالب وحصر السلوكيات السلبية والإيجابية ومسببات حدوثها، والبدء بالحد من مسببات السلوك السلبي."],en:["A second verbal warning at the moment of the incident, with reinforcement of the positive behaviour.","Preparing the student, listing negative and positive behaviours and their causes, and beginning to reduce the causes of the negative behaviour."]}},
      {t:{ar:"الإجراء الثالث",en:"Third procedure"},s:{ar:["تدوين المشكلة السلوكية من المعلم المباشر للموقف في سجل المشكلات السلوكية وتوقيع الطالب عليها.","إشعار ولي أمر الطالب هاتفياً بالمشكلة السلوكية.","حسم درجة من درجات السلوك الإيجابي من قبل إدارة المدرسة، مع تمكين الطالب من فرص التعويض وإشعار ولي الأمر بذلك.","بعد تنفيذ الإجراء: تحويل الطالب إلى الموجّه الطلابي لدراسة حالته."],en:["The teacher records the violation in the behaviour log and the student signs it.","The guardian is notified of the violation by phone.","One mark is deducted from positive conduct by the administration, the student is given recovery opportunities, and the guardian is informed.","After the procedure, the student is referred to the counsellor for case study."]}},
      {t:{ar:"الإجراء الرابع",en:"Fourth procedure"},s:{ar:["دعوة ولي أمر الطالب وإخطاره بسلوك الطالب غير المرغوب فيه، والاتفاق على خطة لتعديل السلوك بين الأسرة والمدرسة يقوم بها الموجّه الطلابي.","حسم درجة من درجات السلوك الإيجابي مع تمكينه من فرص التعويض وإشعار ولي الأمر.","تحويل الطالب إلى لجنة التوجيه الطلابي بالمدرسة لبحث أسباب عدم استجابته لإجراءات تعديل السلوك، وإيجاد الحلول المناسبة وفق تقرير دراسة الحالة.","متابعة حالة الطالب من قبل الموجّه الطلابي لتقديم الخدمات التربوية."],en:["The guardian is summoned and informed; a behaviour modification plan is agreed between family and school and run by the counsellor.","One mark is deducted, with recovery opportunities and notification to the guardian.","The student is referred to the school guidance committee to examine why the plan is not working and to find suitable solutions per the case report.","The counsellor follows the case and provides educational services."]}}]},

  {n:2, art:{ar:"المادة (7)",en:"Article 7"}, ded:{ar:"درجتان",en:"2 marks"},
   name:{ar:"الدرجة الثانية",en:"Level Two"},
   v:{ar:["عدم حضور الحصة الدراسية أو الهروب منها","الدخول أو الخروج من الفصل دون استئذان","دخول فصل آخر دون استئذان","إثارة الفوضى داخل الفصل أو المدرسة أو وسائل النقل المدرسي","الشجار أو الاشتراك في مضاربة جماعية","الإشارة بحركات مخلّة بالأدب تجاه الطلبة","التلفظ بكلمات نابية على الطلبة أو تهديدهم أو السخرية منهم","إلحاق الضرر المتعمد بممتلكات الطلبة","العبث بتجهيزات المدرسة أو مبانيها (أجهزة الحاسوب، أدوات ومعدات الأمن والسلامة، الكهرباء، المعامل، حافلة المدرسة، الكتابة على الجدار وغيره)","امتهان الكتب الدراسية"],
       en:["Not attending class or leaving it without permission","Entering or leaving the classroom without permission","Entering another classroom without permission","Causing disorder in the classroom, the school, or school transport","Fighting or taking part in a group brawl","Indecent gestures toward students","Foul language toward students, threatening them, or mocking them","Deliberate damage to other students' property","Tampering with school equipment or buildings (computers, safety equipment, electrics, laboratories, the school bus, writing on walls)","Defacing textbooks"]},
   p:[{t:{ar:"الإجراء الأول",en:"First procedure"},s:{ar:["إشعار ولي الأمر هاتفياً بالمشكلة السلوكية والإجراءات المتخذة.","حسم درجتين من درجات السلوك الإيجابي مع تمكينه من فرص التعويض وإشعار ولي الأمر.","الاعتذار إلى من أُسيء إليهم.","إصلاح ما أتلفه الطالب أو إحضار بديل عنه.","إحالة الطالب للموجّه الطلابي لدراسة حالته."],en:["The guardian is notified by phone of the violation and the procedures taken.","Two marks are deducted, with recovery opportunities and notification to the guardian.","An apology to those wronged.","Repair of what was damaged, or a replacement.","Referral to the counsellor for case study."]}},
      {t:{ar:"الإجراء الثاني",en:"Second procedure"},s:{ar:["جميع ما ورد في الإجراء الأول مع تغيير إجراءات خطة تعديل السلوك.","دعوة ولي أمر الطالب ومناقشة خطة تعديل السلوك، ووضع برنامج وقائي مشترك مع الأسرة، وأخذ تعهد خطي على الطالب بعدم تكرار السلوك غير المرغوب فيه، وتوقيع ولي الأمر بالعلم.","متابعة حالة الطالب من قبل الموجّه الطلابي لتقديم الخدمات التربوية."],en:["Everything in the first procedure, with the behaviour plan revised.","The guardian is summoned; the plan is discussed, a joint preventive programme is set with the family, the student signs a pledge not to repeat the behaviour, and the guardian countersigns.","The counsellor follows the case and provides educational services."]}},
      {t:{ar:"الإجراء الثالث",en:"Third procedure"},s:{ar:["جميع ما ورد في الإجراء الثاني مع تغيير إجراءات خطة تعديل السلوك.","تحويل الطالب إلى لجنة التوجيه الطلابي بالمدرسة لبحث أسباب عدم استجابته، وإيجاد الحلول المناسبة وفق تقرير دراسة الحالة.","نقل الطالب إلى فصل آخر وفقاً لقرار لجنة التوجيه الطلابي بالمدرسة."],en:["Everything in the second procedure, with the behaviour plan revised.","Referral to the school guidance committee to examine the lack of response and find suitable solutions per the case report.","Transfer to another class by decision of the school guidance committee."]}}],
   notes:{ar:["استدعاء الهلال الأحمر لنقل الطالب المصاب إلى أقرب مركز صحي إذا تطلب الأمر ذلك.","تبليغ الجهات الأمنية المختصة فور وقوع المشكلة بعد إشعار ولي الأمر، وتوثيق الإجراءات المتخذة."],
          en:["The Red Crescent is called to move an injured student to the nearest health centre if required.","Security authorities are notified immediately after the guardian is informed, and every procedure is documented."]}},

  {n:3, art:{ar:"المادة (8)",en:"Article 8"}, ded:{ar:"ثلاث درجات",en:"3 marks"},
   name:{ar:"الدرجة الثالثة",en:"Level Three"},
   v:{ar:["إلحاق الضرر المتعمد بتجهيزات المدرسة أو مبانيها (أجهزة الحاسوب، أدوات ومعدات الأمن والسلامة، الكهرباء، المعامل، الحافلة المدرسية)","سرقة شيء من ممتلكات الطلبة أو المدرسة","التعرض لأحد الطلبة بالضرب","التصوير أو التسجيل الصوتي للطلبة","الهروب من المدرسة","التوقيع عن ولي الأمر من غير علمه على المكاتبات المتبادلة بين المدرسة وولي الأمر","إحضار أو استخدام المواد أو الألعاب الخطرة إلى المدرسة، مثل: الألعاب النارية، البخاخات الغازية الملوّنة، المواد الكيميائية"],
       en:["Deliberate damage to school equipment or buildings (computers, safety equipment, electrics, laboratories, the school bus)","Stealing property belonging to students or the school","Striking another student","Photographing or audio-recording students","Absconding from school","Signing on the guardian's behalf, without their knowledge, on correspondence between school and home","Bringing or using hazardous materials or toys at school — fireworks, coloured gas sprays, chemical substances"]},
   p:[{t:{ar:"الإجراء الأول",en:"First procedure"},s:{ar:["دعوة ولي أمر الطالب ومناقشته في خطة تعديل السلوك، ووضع برنامج وقائي مشترك مع الأسرة، وأخذ تعهد خطي على الطالب بعدم تكرار السلوك، وتوقيع ولي الأمر بالعلم.","حسم ثلاث درجات من درجات السلوك الإيجابي مع تمكينه من فرص التعويض وإشعار ولي الأمر.","الاعتذار إلى من أُسيء إليهم.","إصلاح ما أتلفه الطالب أو إحضار بديل عنه.","مصادرة ما بحوزة الطالب من مواد ممنوعة وإتلافها من قبل لجنة التوجيه الطلابي بالمدرسة — فيما لم يرد فيه نص نظامي — وإعداد محضر بذلك.","إحالة الطالب إلى الموجّه الطلابي لدراسة حالته."],en:["The guardian is summoned; the behaviour plan is discussed, a joint preventive programme is set, the student signs a pledge and the guardian countersigns.","Three marks are deducted, with recovery opportunities and notification to the guardian.","An apology to those wronged.","Repair of what was damaged, or a replacement.","Prohibited items are confiscated and destroyed by the school guidance committee — where no statutory provision applies — and a record is drawn up.","Referral to the counsellor for case study."]}},
      {t:{ar:"الإجراء الثاني",en:"Second procedure"},s:{ar:["جميع ما ورد في الإجراء الأول مع تغيير إجراءات خطة تعديل السلوك.","نقل الطالب إلى فصل آخر وفقاً لقرار لجنة التوجيه الطلابي.","متابعة حالة الطالب من قبل الموجّه الطلابي لتقديم الخدمات التربوية."],en:["Everything in the first procedure, with the behaviour plan revised.","Transfer to another class by decision of the guidance committee.","The counsellor follows the case and provides educational services."]}}]},

  {n:4, art:{ar:"المادة (9)",en:"Article 9"}, ded:{ar:"عشر درجات",en:"10 marks"}, sev:true,
   name:{ar:"الدرجة الرابعة",en:"Level Four"},
   v:{ar:["الإساءة أو الاستهزاء بشيء من شعائر الإسلام","الإساءة للدولة أو رموزها","التحرش الجنسي","إشعال النار داخل المدرسة","حيازة السجائر بأنواعها","التدخين بأنواعه داخل المدرسة","حيازة آلة حادة (مثل السكاكين)","الجرائم المعلوماتية بكافة أنواعها","المظاهر أو الصور أو الشعارات التي تدل على الشذوذ الجنسي أو الترويج لها","التنمّر بجميع أنواعه وأشكاله","حيازة أو عرض المواد الإعلامية الممنوعة المقروءة أو المسموعة أو المرئية"],
       en:["Offending or mocking any of the rites of Islam","Offending the State or its symbols","Sexual harassment","Starting a fire on school grounds","Possession of cigarettes of any kind","Smoking of any kind on school grounds","Possession of a sharp instrument such as a knife","Cybercrimes of all kinds","Displays, images or slogans indicating or promoting sexual deviance","Bullying of every kind","Possessing or displaying prohibited printed, audio or visual media"]},
   p:[{t:{ar:"الإجراء (يُطبَّق مباشرة)",en:"Procedure (applied immediately)"},s:{ar:["دعوة ولي أمر الطالب وتوضيح الإجراءات المترتبة على هذا السلوك، ومناقشته في خطة تعديل السلوك، ووضع برنامج وقائي مشترك مع الأسرة، وأخذ تعهد خطي على الطالب، وتوقيع ولي الأمر بالعلم.","حسم عشر درجات من درجات السلوك الإيجابي مع تمكينه من فرص التعويض وإشعار ولي الأمر.","الاعتذار إلى من أُسيء إليهم.","تحويل الطالب إلى الموجّه الطلابي لدراسة حالته.","ترفع إدارة المدرسة رسمياً وبصفة عاجلة إلى إدارة التعليم محضر اجتماع لجنة التوجيه بالمدرسة بخصوص القضية.","يصدر مدير التعليم قراراً بنقل الطالب إلى مدرسة أخرى، مع استمراره بالدراسة حتى النقل، ومع الأخذ برأي ولي الأمر في المدرسة التي سيُنقل إليها الطالب — وفي حال عدم موافقته يُنقل إلى أقرب مدرسة لمقر سكنه.","إحالة الحالة للموجّه الطلابي بالمدرسة المنقول إليها لتقديم برنامج تربوي يشتمل على جلسات تعديل السلوك.","يُكتب تعهد خطي من الطالب وبحضور ولي الأمر بالالتزام بالانضباط والسلوك الحسن بعد استكمال البرنامج التربوي.","متابعة الحالة من الموجّه الطلابي بالمدرسة المنقول إليها لتقديم الخدمات التربوية."],
       en:["The guardian is summoned and told what this behaviour entails; the plan is discussed, a joint preventive programme is set, the student signs a pledge and the guardian countersigns.","Ten marks are deducted, with recovery opportunities and notification to the guardian.","An apology to those wronged.","Referral to the counsellor for case study.","The school escalates the guidance committee's minutes to the Education Directorate formally and urgently.","The Director of Education issues a decision transferring the student to another school; the student continues attending until the transfer, and the guardian's view on the receiving school is taken — if they do not agree, the student is moved to the nearest school to their home.","The case is referred to the counsellor at the receiving school for an educational programme including behaviour modification sessions.","On completing the programme the student signs a pledge, in the guardian's presence, to maintain discipline and good conduct.","The counsellor at the receiving school follows the case and provides educational services."]}}],
   notes:{ar:["استدعاء الهلال الأحمر لنقل الطالب المصاب إلى أقرب مركز صحي إذا تطلب الأمر ذلك.","تبليغ الجهات الأمنية المختصة فور وقوع المشكلة بعد إشعار ولي الأمر وتوثيق الإجراءات المتخذة.","في حال تصنيف المشكلة ضمن حالات الإيذاء أو الإهمال أو غير الواردة في النظام، وبعد استنفاد جميع الإجراءات، يتم التواصل مباشرة مع مركز تلقي البلاغات (1919)."],
          en:["The Red Crescent is called to move an injured student to the nearest health centre if required.","Security authorities are notified immediately after the guardian is informed, and every procedure is documented.","If the case falls under abuse or neglect, or is not covered by the rules, and once all procedures are exhausted, the Reporting Centre (1919) is contacted directly."]}}
 ]},

 {id:"sec", ar:"المرحلة المتوسطة والثانوية — تعليم حضوري", en:"Intermediate & Secondary — in person", levels:[
  {n:1, art:{ar:"المادة (10)",en:"Article 10"}, ded:{ar:"درجة واحدة",en:"1 mark"},
   name:{ar:"الدرجة الأولى",en:"Level One"},
   v:{ar:["التأخر الصباحي","عدم حضور الاصطفاف الصباحي — إذا كان الطالب متواجداً داخل المدرسة","التأخر عن الاصطفاف الصباحي أو العبث أثناءه","التأخر في الدخول إلى الحصص","إعاقة سير الحصص الدراسية مثل: الحديث الجانبي، المقاطعة المستمرة غير الهادفة لشرح المعلم، تناول الأطعمة أو المشروبات أثناء الدرس","النوم داخل الفصل","تكرار خروج ودخول الطلبة من البوابة قبل وقت الحضور والانصراف","التجمهر أمام بوابة المدرسة"],
       en:["Arriving late in the morning","Not attending the morning assembly while present at school","Arriving late to the assembly, or misbehaving during it","Arriving late to class","Disrupting the lesson: side conversations, persistent purposeless interruption of the teacher, eating or drinking during the lesson","Sleeping in class","Repeatedly entering or leaving the gate outside arrival and dismissal times","Loitering in groups at the school gate"]},

      {t:{ar:"الإجراء الثاني",en:"Second procedure"},s:{ar:["التنبيه الشفهي الثاني عند مباشرة الموقف بأسلوب تربوي حكيم، وتعزيز السلوك الإيجابي.","تهيئة الطالب وحصر السلوكيات السلبية والإيجابية ومسببات حدوثها، والبدء بالحد من مسببات السلوك السلبي."],en:["A second verbal warning at the moment of the incident, reinforcing the positive behaviour.","Preparing the student, listing behaviours and their causes, and beginning to reduce the causes of the negative behaviour."]}},
      {t:{ar:"الإجراء الثالث",en:"Third procedure"},s:{ar:["تدوين المشكلة السلوكية من المعلم المباشر للموقف وتوقيع الطالب عليها.","إشعار ولي أمر الطالب هاتفياً بالمشكلة السلوكية والتنسيق معه لتعديل السلوك المخالف.","حسم درجة من درجات السلوك الإيجابي من قبل إدارة المدرسة مع تمكينه من فرص التعويض وإشعار ولي الأمر.","تحويل الطالب إلى الموجّه الطلابي لدراسة حالته."],en:["The teacher records the violation and the student signs it.","The guardian is notified by phone and coordinated with to modify the behaviour.","One mark is deducted, with recovery opportunities and notification to the guardian.","Referral to the counsellor for case study."]}},
      {t:{ar:"الإجراء الرابع",en:"Fourth procedure"},s:{ar:["دعوة ولي أمر الطالب وإخطاره بالسلوك غير المرغوب فيه، والاتفاق على خطة لتعديل السلوك بين الأسرة والمدرسة يقوم بها الموجّه الطلابي.","حسم درجة من درجات السلوك الإيجابي مع تمكينه من فرص التعويض وإشعار ولي الأمر.","تحويل الطالب إلى لجنة التوجيه الطلابي بالمدرسة لبحث أسباب عدم الاستجابة وإيجاد الحلول المناسبة وفق تقرير دراسة الحالة.","يتابع الموجّه الطلابي حالته لتقديم الخدمات التربوية."],en:["The guardian is summoned and informed; a behaviour plan is agreed and run by the counsellor.","One mark is deducted, with recovery opportunities and notification to the guardian.","Referral to the school guidance committee to examine the lack of response and find suitable solutions per the case report.","The counsellor follows the case and provides educational services."]}}]},

  {n:2, art:{ar:"المادة (11)",en:"Article 11"}, ded:{ar:"درجتان",en:"2 marks"},
   name:{ar:"الدرجة الثانية",en:"Level Two"},
   v:{ar:["عدم حضور الحصة الدراسية أو الهروب منها","الدخول أو الخروج من الفصل دون استئذان","دخول فصل آخر دون استئذان","إثارة الفوضى داخل الفصل أو المدرسة أو وسائل النقل المدرسي"],
       en:["Not attending class or leaving it without permission","Entering or leaving the classroom without permission","Entering another classroom without permission","Causing disorder in the classroom, the school, or school transport"]},
   p:[{t:{ar:"الإجراء الأول",en:"First procedure"},s:{ar:["تحويل الطالب إلى إدارة المدرسة.","إشعار ولي الأمر هاتفياً بالمشكلة السلوكية والإجراءات المتخذة.","حسم درجتين من درجات السلوك الإيجابي مع تمكينه من فرص التعويض لتعديل سلوكه وتعويض الدرجات المحسومة، وإشعار ولي الأمر.","أخذ تعهد خطي على الطالب بعدم تكرار المخالفة.","تحويل الطالب إلى الموجّه الطلابي لدراسة حالته."],en:["The student is referred to the school administration.","The guardian is notified by phone of the violation and the procedures taken.","Two marks are deducted, with opportunities to modify the behaviour and recover the marks, and notification to the guardian.","The student signs a pledge not to repeat the violation.","Referral to the counsellor for case study."]}},
      {t:{ar:"الإجراء الثاني",en:"Second procedure"},s:{ar:["جميع ما ذُكر في الإجراء الأول.","دعوة ولي أمر الطالب حضورياً، ومناقشته خطة تعديل السلوك، ووضع برنامج وقائي مشترك مع الأسرة، وتوقيع ولي الأمر بالعلم.","متابعة حالة الطالب من قبل الموجّه الطلابي لتقديم الخدمات التربوية."],en:["Everything in the first procedure.","The guardian is summoned in person; the behaviour plan is discussed, a joint preventive programme is set, and the guardian countersigns.","The counsellor follows the case and provides educational services."]}},
      {t:{ar:"الإجراء الثالث",en:"Third procedure"},s:{ar:["تنفيذ جميع ما ذُكر في الإجراء الثاني.","نقل الطالب إلى فصل آخر وفقاً لقرار لجنة التوجيه الطلابي بالمدرسة.","تحويل الطالب المخالف إلى لجنة التوجيه الطلابي بالمدرسة لوضع الحلول المناسبة لمخالفته، وفقاً لتقرير دراسة الحالة من الموجّه الطلابي."],en:["Everything in the second procedure.","Transfer to another class by decision of the school guidance committee.","Referral to the guidance committee to set appropriate solutions, per the counsellor's case report."]}}]},

  {n:3, art:{ar:"المادة (12)",en:"Article 12"}, ded:{ar:"ثلاث درجات",en:"3 marks"},
   name:{ar:"الدرجة الثالثة",en:"Level Three"},
   v:{ar:["عدم التقيّد بالزي المدرسي","الشجار أو الاشتراك في مضاربة جماعية","الإشارة بحركات مخلّة بالأدب تجاه الطلبة","التلفظ بكلمات نابية على الطلبة أو تهديدهم أو السخرية منهم","إلحاق الضرر المتعمد بممتلكات الطلبة","العبث بتجهيزات المدرسة أو مبانيها (أجهزة الحاسوب، أدوات ومعدات الأمن والسلامة، الكهرباء، المعامل، حافلة المدرسة، الكتابة على الجدار وغيره)","إحضار المواد أو الألعاب الخطرة إلى المدرسة دون استخدامها، مثل: الألعاب النارية، البخاخات الغازية الملوّنة، المواد الكيميائية","حيازة السجائر بأنواعها","حيازة المواد الإعلامية الممنوعة المقروءة أو المسموعة أو المرئية","التوقيع عن ولي الأمر من غير علمه على المكاتبات المتبادلة بين المدرسة وولي الأمر","امتهان الكتب الدراسية"],
       en:["Not adhering to the school uniform","Fighting or taking part in a group brawl","Indecent gestures toward students","Foul language toward students, threatening them, or mocking them","Deliberate damage to other students' property","Tampering with school equipment or buildings (computers, safety equipment, electrics, laboratories, the school bus, writing on walls)","Bringing hazardous materials or toys to school without using them — fireworks, coloured gas sprays, chemical substances","Possession of cigarettes of any kind","Possession of prohibited printed, audio or visual media","Signing on the guardian's behalf, without their knowledge, on school correspondence","Defacing textbooks"]},
   p:[{t:{ar:"الإجراء الأول",en:"First procedure"},s:{ar:["تحويل الطالب إلى إدارة المدرسة.","دعوة ولي أمر الطالب وتوضيح الإجراءات المترتبة على هذا السلوك حال تكراره، ومناقشته خطة تعديل السلوك، ووضع برنامج وقائي مشترك مع الأسرة، وأخذ تعهد خطي على الطالب، وتوقيع ولي الأمر بالعلم.","حسم ثلاث درجات من درجات السلوك الإيجابي مع تمكينه من فرص التعويض وإشعار ولي الأمر.","الاعتذار إلى من أُسيء إليهم.","إصلاح ما أتلفه الطالب أو إحضار بديل عنه.","مصادرة ما بحوزة الطالب من مواد ممنوعة وإتلافها من قبل لجنة التوجيه الطلابي — فيما لم يرد فيه نص نظامي — وإعداد محضر بذلك.","تحويل الطالب إلى الموجّه الطلابي لدراسة حالته."],en:["The student is referred to the school administration.","The guardian is summoned and told what a repeat would entail; the plan is discussed, a joint preventive programme is set, the student signs a pledge and the guardian countersigns.","Three marks are deducted, with recovery opportunities and notification to the guardian.","An apology to those wronged.","Repair of what was damaged, or a replacement.","Prohibited items are confiscated and destroyed by the guidance committee — where no statutory provision applies — and a record is drawn up.","Referral to the counsellor for case study."]}},
      {t:{ar:"الإجراء الثاني",en:"Second procedure"},s:{ar:["تنفيذ جميع ما ورد في الإجراء الأول.","دعوة ولي أمر الطالب وإنذار الطالب كتابياً بالنقل إلى مدرسة أخرى حال تكرار المخالفة، وتوقيع ولي الأمر بالعلم.","تحويل الحالة إلى لجنة التوجيه الطلابي بالمدرسة لوضع الحلول المناسبة وفقاً لتقرير دراسة الحالة.","نقل الطالب المخالف سلوكياً إلى فصل آخر وفقاً لقرار لجنة التوجيه الطلابي.","متابعة حالة الطالب من قبل الموجّه الطلابي لتقديم الخدمات التربوية."],en:["Everything in the first procedure.","The guardian is summoned and the student receives a written warning of transfer to another school on repetition; the guardian countersigns.","The case is referred to the guidance committee for suitable solutions per the case report.","Transfer to another class by decision of the guidance committee.","The counsellor follows the case and provides educational services."]}}]},

  {n:4, art:{ar:"المادة (13)",en:"Article 13"}, ded:{ar:"عشر درجات",en:"10 marks"},
   name:{ar:"الدرجة الرابعة",en:"Level Four"},
   v:{ar:["تعمّد إصابة أحد الطلبة عن طريق الضرب باليد أو استخدام أدوات غير حادة تُحدث إصابة (جرحاً أو نزفاً أو كسراً)","سرقة شيء من ممتلكات الطلبة أو المدرسة","التصوير أو التسجيل الصوتي للطلبة","إلحاق الضرر المتعمد بتجهيزات المدرسة أو مبانيها (أجهزة الحاسوب، أدوات ومعدات الأمن والسلامة، الكهرباء، المعامل، الحافلة المدرسية)","التدخين بأنواعه داخل المدرسة","الهروب من المدرسة","إحضار أو استخدام المواد أو الألعاب الخطرة إلى المدرسة، مثل: الألعاب النارية، البخاخات الغازية الملوّنة، المواد الكيميائية","عرض أو توزيع المواد الإعلامية الممنوعة المقروءة أو المسموعة أو المرئية"],
       en:["Deliberately injuring a student by hand or with a blunt instrument, causing a wound, bleeding or a fracture","Stealing property belonging to students or the school","Photographing or audio-recording students","Deliberate damage to school equipment or buildings (computers, safety equipment, electrics, laboratories, the school bus)","Smoking of any kind on school grounds","Absconding from school","Bringing or using hazardous materials or toys at school — fireworks, coloured gas sprays, chemical substances","Displaying or distributing prohibited printed, audio or visual media"]},
   p:[{t:{ar:"الإجراء الأول",en:"First procedure"},s:{ar:["إحالة الطالب من قبل إدارة المدرسة إلى لجنة التوجيه الطلابي لدراسة مشكلته السلوكية بعد حدوثها مباشرة.","دعوة ولي أمر الطالب وتوضيح الإجراءات المترتبة حال التكرار، ومناقشة خطة تعديل السلوك، ووضع برنامج وقائي مشترك مع الأسرة، وأخذ تعهد خطي، وإنذاره بالنقل إلى مدرسة أخرى حال إعادة تكرار المشكلة، وتوقيع ولي الأمر بالعلم.","حسم عشر درجات من درجات السلوك الإيجابي مع تمكينه من فرص التعويض وإشعار ولي الأمر.","تقديم الاعتذار لمن أُسيء إليهم.","إصلاح ما أتلفه الطالب أو إحضار بديل عنه، وإشعار ولي الأمر.","مصادرة ما بحوزة الطالب من مواد ممنوعة وإتلافها، وإعداد محضر بذلك من قبل لجنة التوجيه الطلابي.","نقل الطالب من فصل إلى آخر وفقاً لقرار لجنة التوجيه الطلابي.","متابعة الحالة من الموجّه الطلابي وتقديم الخدمات التربوية."],en:["The school refers the student to the guidance committee immediately after the incident.","The guardian is summoned and told what a repeat entails; the plan is discussed, a preventive programme is set with the family, the student signs a pledge, is warned of transfer to another school on repetition, and the guardian countersigns.","Ten marks are deducted, with recovery opportunities and notification to the guardian.","An apology to those wronged.","Repair of what was damaged, or a replacement, with the guardian informed.","Prohibited items are confiscated and destroyed, with a record drawn up by the guidance committee.","Transfer to another class by decision of the guidance committee.","The counsellor follows the case and provides educational services."]}},
      {t:{ar:"الإجراء الثاني",en:"Second procedure"},s:{ar:["تنفيذ جميع ما ورد في الإجراء الأول، باستثناء نقل الطالب من الفصل.","رفع محضر اجتماع لجنة التوجيه بالمدرسة إلى إدارة التعليم رسمياً وبصفة عاجلة بخصوص القضية.","إصدار قرار من مدير التعليم بنقل الطالب إلى مدرسة أخرى (الصفان الثاني والثالث الثانوي يتم التعامل معهم وفق نظام المسارات)، مع استمرار الدراسة حتى النقل، وأخذ رأي ولي الأمر في المدرسة التي سيُنقل إليها الطالب — وفي حال عدم موافقته يُنقل إلى أقرب مدرسة لمقر سكنه.","تمكين الطالب من فرص التعويض لتعديل سلوكه وتعويض الدرجات المحسومة في المدرسة المنقول إليها، وإشعار ولي أمره.","متابعة الحالة من الموجّه الطلابي بالمدرسة المنقول إليها وتقديم الخدمات التربوية."],en:["Everything in the first procedure, except the class transfer.","The guidance committee's minutes are escalated to the Education Directorate formally and urgently.","The Director of Education issues a transfer decision (Grades 11–12 are handled under the Pathways system); the student continues attending until the transfer, and the guardian's view on the receiving school is taken — if they do not agree, the nearest school to their home is used.","The student is given recovery opportunities at the receiving school and the guardian is informed.","The counsellor at the receiving school follows the case and provides educational services."]}}],
   notes:{ar:["استدعاء الهلال الأحمر لنقل الطالب المصاب إلى أقرب مركز صحي إذا تطلب الأمر ذلك.","تبليغ الجهات الأمنية المختصة فور وقوع المشكلة بعد إشعار ولي الأمر، وتوثيق الإجراءات المتخذة.","في حال تصنيف المشكلة ضمن حالات الإيذاء والإهمال أو غير الواردة في النظام، يتم التواصل مباشرة مع مركز تلقي البلاغات (1919)."],
          en:["The Red Crescent is called to move an injured student to the nearest health centre if required.","Security authorities are notified immediately after the guardian is informed, and every procedure is documented.","If the case falls under abuse or neglect, or is not covered by the rules, the Reporting Centre (1919) is contacted directly."]}},

  {n:5, art:{ar:"المادة (14)",en:"Article 14"}, ded:{ar:"خمس عشرة درجة",en:"15 marks"}, sev:true,
   name:{ar:"الدرجة الخامسة",en:"Level Five"},
   v:{ar:["الإساءة أو الاستهزاء بشيء من شعائر الإسلام","الإساءة للدولة أو رموزها","بث أو ترويج أفكار ومعتقدات متطرفة أو تكفيرية أو إلحادية أو مسيئة لنظم المجتمع السياسية والاجتماعية","الإساءة إلى الأديان السماوية، أو إثارة كل ما يسبب العنصرية أو الفتن القبلية أو الطائفية أو المذهبية","التزوير أو الاستخدام أو الاستفادة من الوثائق أو الأختام الرسمية بطريقة غير مشروعة نظاماً","التحرش الجنسي","المظاهر أو الصور أو الشعارات التي تدل على الشذوذ الجنسي أو الترويج لها","إشعال النار داخل المدرسة","حيازة أو استخدام أو تهديد الطلبة بالأسلحة النارية أو ما في حكمها (مثل: السكاكين والأدوات الحادة والرصاص بدون مسدس)","حيازة أو تعاطي أو ترويج المخدرات أو المسكرات","الجرائم المعلوماتية بكافة أنواعها","ابتزاز الطلبة","التنمّر بجميع أنواعه وأشكاله"],
       en:["Offending or mocking any of the rites of Islam","Offending the State or its symbols","Spreading extremist, takfiri or atheistic beliefs, or beliefs hostile to the social and political order","Offending the divine religions, or inciting racism, tribal, sectarian or denominational strife","Forging, using or exploiting official documents or seals unlawfully","Sexual harassment","Displays, images or slogans indicating or promoting sexual deviance","Starting a fire on school grounds","Possessing, using or threatening students with firearms or their equivalent (knives, sharp instruments, ammunition without a firearm)","Possessing, using or dealing narcotics or intoxicants","Cybercrimes of all kinds","Extorting students","Bullying of every kind"]},
   p:[{t:{ar:"الإجراء (يُطبَّق مباشرة دون تدرّج)",en:"Procedure (applied immediately, without gradation)"},s:{ar:["تُدوّن إدارة المدرسة محضر إثبات الواقعة.","دعوة ولي أمر الطالب وتبليغه بمشكلة الطالب والإجراءات المترتبة على ذلك.","حسم خمس عشرة درجة من درجات السلوك الإيجابي، مع تمكينه من فرص التعويض لتعديل سلوكه وتعويض الدرجات المحسومة في المدرسة المنقول إليها، وإشعار ولي أمره.","اجتماع لجنة التوجيه الطلابي بالمدرسة بعد وقوع القضية مباشرة لدراسة ظروفها وملابساتها.","متابعة الحالة من الموجّه الطلابي وتقديم الخدمات التربوية.","رفع محضر اجتماع لجنة التوجيه الطلابي بالمدرسة بخصوص القضية إلى إدارة التعليم رسمياً وبصفة عاجلة.","إصدار قرار من مدير التعليم بنقل الطالب إلى مدرسة أخرى (الصفان الثاني والثالث الثانوي وفق نظام المسارات)، مع استمرار الدراسة حتى النقل، وأخذ رأي ولي الأمر في المدرسة التي سيُنقل إليها — وفي حال عدم موافقته يُنقل إلى أقرب مدرسة لمقر سكنه.","متابعة الحالة من الموجّه الطلابي بالمدرسة المنقول إليها الطالب، وتقديم الخدمات التربوية."],
       en:["The school draws up an official incident report.","The guardian is summoned and informed of the violation and what it entails.","Fifteen marks are deducted, with opportunities to modify the behaviour and recover marks at the receiving school, and the guardian is informed.","The guidance committee convenes immediately after the incident to examine its circumstances.","The counsellor follows the case and provides educational services.","The committee's minutes are escalated to the Education Directorate formally and urgently.","The Director of Education issues a transfer decision (Grades 11–12 under the Pathways system); the student continues attending until transfer, and the guardian's view on the receiving school is taken — otherwise the nearest school to their home is used.","The counsellor at the receiving school follows the case and provides educational services."]}}],
   notes:{ar:["استدعاء الهلال الأحمر لنقل الطالب المصاب إلى أقرب مركز صحي إذا تطلب الأمر ذلك.","تبليغ الجهات الأمنية المختصة فور وقوع المشكلة بعد إشعار ولي الأمر، وتوثيق الإجراءات المتخذة.","في حال تصنيف المشكلة ضمن حالات الإيذاء والإهمال أو غير الواردة في النظام، يتم التواصل مباشرة مع مركز تلقي البلاغات (1919).","تُراعى محددات التنمر عند تطبيق الإجراءات في المشكلات السلوكية من الدرجة الخامسة."],
          en:["The Red Crescent is called to move an injured student to the nearest health centre if required.","Security authorities are notified immediately after the guardian is informed, and every procedure is documented.","If the case falls under abuse or neglect, or is not covered by the rules, the Reporting Centre (1919) is contacted directly.","The bullying criteria are applied when carrying out Level Five procedures."]}}
 ]},

 {id:"staff", ar:"المخالفات تجاه الهيئة التعليمية والإدارية", en:"Violations against teaching & administrative staff", levels:[
  {n:4, art:{ar:"المادة (15) — جميع المراحل",en:"Article 15 — all stages"}, ded:{ar:"عشر درجات",en:"10 marks"},
   name:{ar:"الدرجة الرابعة",en:"Level Four"},
   v:{ar:["تهديد المعلمين أو الإداريين أو من يكمّلهم من منسوبي المدرسة","التلفظ بألفاظ غير لائقة تجاه المعلمين أو الإداريين أو من يكمّلهم","السخرية من المعلمين أو الإداريين أو من يكمّلهم قولاً أو فعلاً","التوقيع عن أحد منسوبي المدرسة على المكاتبات المتبادلة بين المدرسة وأولياء الأمور","تصوير المعلمين أو الإداريين أو من يكمّلهم أو التسجيل الصوتي لهم — ما لم يُؤخذ إذن خطي بالموافقة الصريحة على ذلك"],
       en:["Threatening teachers, administrators or other school staff","Using inappropriate language toward teachers, administrators or other staff","Mocking teachers, administrators or other staff by word or deed","Signing on a staff member's behalf on correspondence between school and home","Photographing or audio-recording staff without express written consent"]},
   p:[{t:{ar:"الإجراء الأول",en:"First procedure"},s:{ar:["إحالة الطالب من قبل إدارة المدرسة إلى لجنة التوجيه الطلابي لدراسة مشكلته بعد حدوثها مباشرة.","دعوة ولي أمر الطالب وتوضيح الإجراءات المترتبة حال التكرار، ومناقشة خطة تعديل السلوك، ووضع برنامج وقائي مشترك مع الأسرة، وأخذ تعهد خطي، وإنذاره بالنقل إلى مدرسة أخرى حال التكرار، وتوقيع ولي الأمر بالعلم.","حسم عشر درجات من درجات السلوك الإيجابي مع تمكينه من فرص التعويض وإشعار ولي الأمر.","مصادرة ما بحوزة الطالب من مواد وإتلافها — فيما لم يرد فيه نص نظامي — من قبل لجنة التوجيه الطلابي وإعداد محضر بذلك.","الاعتذار لمن أُسيء إليهم.","نقل الطالب إلى فصل آخر وفقاً لقرار لجنة التوجيه الطلابي.","تحويل الطالب إلى الموجّه الطلابي لدراسة حالته."],en:["The school refers the student to the guidance committee immediately after the incident.","The guardian is summoned and told what a repeat entails; the plan is discussed, a preventive programme is set, the student signs a pledge, is warned of transfer on repetition, and the guardian countersigns.","Ten marks are deducted, with recovery opportunities and notification to the guardian.","Items in the student's possession are confiscated and destroyed — where no statutory provision applies — by the guidance committee, with a record drawn up.","An apology to those wronged.","Transfer to another class by decision of the guidance committee.","Referral to the counsellor for case study."]}},
      {t:{ar:"الإجراء الثاني",en:"Second procedure"},s:{ar:["تنفيذ جميع ما ورد في الإجراء الأول — باستثناء نقل الطالب من الفصل.","ترفع إدارة المدرسة رسمياً وبصفة عاجلة إلى إدارة التعليم محضر اجتماع لجنة التوجيه بالمدرسة بخصوص القضية.","يصدر مدير التعليم قراراً بنقل الطالب إلى مدرسة أخرى (الصفان الثاني والثالث الثانوي وفق نظام المسارات)، مع استمرار الدراسة حتى النقل، والأخذ برأي ولي الأمر في المدرسة التي سيُنقل إليها — وفي حال عدم الموافقة يُنقل إلى أقرب مدرسة لمقر سكنه.","تمكين الطالب من فرص التعويض لتعديل سلوكه وتعويض الدرجات المحسومة في المدرسة المنقول إليها، وإشعار ولي أمره.","متابعة الحالة من الموجّه الطلابي بالمدرسة المنقول إليها لتقديم الخدمات التربوية."],en:["Everything in the first procedure, except the class transfer.","The school escalates the committee's minutes to the Education Directorate formally and urgently.","The Director of Education issues a transfer decision (Grades 11–12 under the Pathways system); attendance continues until transfer, and the guardian's view on the receiving school is taken — otherwise the nearest school to their home is used.","Recovery opportunities are given at the receiving school and the guardian is informed.","The counsellor at the receiving school follows the case and provides educational services."]}}],
   notes:{ar:["تبليغ الجهات الأمنية المختصة فور وقوع المشكلة، بعد إشعار ولي الأمر، وتوثيق الإجراءات المتخذة."],
          en:["Security authorities are notified immediately after the guardian is informed, and every procedure is documented."]}},

  {n:5, art:{ar:"المادة (16) — جميع المراحل",en:"Article 16 — all stages"}, ded:{ar:"خمس عشرة درجة",en:"15 marks"}, sev:true,
   name:{ar:"الدرجة الخامسة",en:"Level Five"},
   v:{ar:["إلحاق الضرر بممتلكات المعلمين أو الإداريين أو من يكمّلهم أو سرقتها","الإشارة بحركات مخلّة بالأدب تجاه المعلمين أو الإداريين أو من يكمّلهم","الاعتداء بالضرب على المعلمين أو الإداريين أو من يكمّلهم","ابتزاز المعلمين أو الإداريين أو من يكمّلهم","الجرائم المعلوماتية تجاه المعلمين أو الإداريين أو من يكمّلهم"],
       en:["Damaging or stealing the property of teachers, administrators or other staff","Indecent gestures toward teachers, administrators or other staff","Physically assaulting teachers, administrators or other staff","Extorting teachers, administrators or other staff","Cybercrimes against teachers, administrators or other staff"]},
   p:[{t:{ar:"الإجراء (يُطبَّق مباشرة دون تدرّج)",en:"Procedure (applied immediately, without gradation)"},s:{ar:["تُدوّن إدارة المدرسة محضر إثبات الواقعة.","دعوة ولي أمر الطالب وتبليغه بمشكلة الطالب والإجراءات المترتبة على ذلك.","حسم خمس عشرة درجة من درجات السلوك الإيجابي مع تمكينه من فرص التعويض في المدرسة المنقول إليها، وإشعار ولي أمره.","اجتماع لجنة التوجيه الطلابي بالمدرسة بعد وقوع القضية مباشرة لدراسة ظروفها وملابساتها.","إصلاح ما أتلفه الطالب أو إحضار بديل عنه، وإشعار ولي الأمر.","تقديم الاعتذار لمن أُسيء إليهم.","رفع محضر اجتماع لجنة التوجيه بالمدرسة رسمياً وبصفة عاجلة إلى إدارة التعليم بخصوص القضية.","إصدار قرار من مدير التعليم بنقل الطالب إلى مدرسة أخرى (الصفان الثاني والثالث الثانوي وفق نظام المسارات)، مع استمرار الدراسة حتى النقل، وأخذ رأي ولي الأمر في المدرسة التي سيُنقل إليها — وفي حال عدم موافقته يُنقل إلى أقرب مدرسة لمقر سكنه.","متابعة الحالة من الموجّه الطلابي بالمدرسة المنقول إليها، وتقديم الخدمات التربوية."],
       en:["The school draws up an official incident report.","The guardian is summoned and informed of the violation and what it entails.","Fifteen marks are deducted, with recovery opportunities at the receiving school, and the guardian is informed.","The guidance committee convenes immediately after the incident to examine its circumstances.","Repair of what was damaged, or a replacement, with the guardian informed.","An apology to those wronged.","The committee's minutes are escalated to the Education Directorate formally and urgently.","The Director of Education issues a transfer decision (Grades 11–12 under the Pathways system); attendance continues until transfer, and the guardian's view on the receiving school is taken — otherwise the nearest school to their home is used.","The counsellor at the receiving school follows the case and provides educational services."]}}],
   notes:{ar:["تبليغ الجهات الأمنية المختصة فور وقوع المشكلة، بعد إشعار ولي الأمر، وتوثيق الإجراءات المتخذة."],
          en:["Security authorities are notified immediately after the guardian is informed, and every procedure is documented."]}}
 ]},

 {id:"eprim", ar:"التعليم الإلكتروني — المرحلة الابتدائية", en:"Distance learning — Primary", levels:[
  {n:1, art:{ar:"المادة (19)",en:"Article 19"}, ded:{ar:"درجة واحدة",en:"1 mark"},
   name:{ar:"الدرجة الأولى",en:"Level One"},
   v:{ar:["التأخر في حضور الحصة الافتراضية","الخروج المتكرر من الحصص الافتراضية في منصات التعليم الإلكترونية المعتمدة بدون عذر مقبول","إعاقة سير الحصص الافتراضية، مثل: الكتابة المزعجة، وتشتيت انتباه الطلبة، والمقاطعة المستمرة غير الهادفة لشرح المعلم أثناء الحصة"],
       en:["Arriving late to the virtual class","Repeatedly leaving virtual classes on the approved platforms without an acceptable excuse","Disrupting the virtual class: disruptive typing, distracting classmates, persistent purposeless interruption of the teacher"]},
   p:[{t:{ar:"الإجراء الأول",en:"First procedure"},s:{ar:["التنبيه الشفهي الأول من المعلم أو إدارة المدرسة عن السلوك وأضراره، وكونه سلوكاً غير مرغوب فيه، بأسلوب تربوي حكيم."],en:["A first verbal warning from the teacher or administration, delivered in a considered educational manner."]}},
      {t:{ar:"الإجراء الثاني",en:"Second procedure"},s:{ar:["التنبيه الشفهي الثاني عند مباشرة الموقف بأسلوب تربوي حكيم، وتعزيز السلوك الإيجابي."],en:["A second verbal warning at the moment of the incident, reinforcing the positive behaviour."]}},
      {t:{ar:"الإجراء الثالث",en:"Third procedure"},s:{ar:["تدوين المشكلة السلوكية من المعلم المباشر للموقف في سجل المشكلات السلوكية وتوقيع الطالب عليها.","إشعار ولي أمر الطالب هاتفياً بالمشكلة السلوكية.","حسم درجة من درجات السلوك الإيجابي من قبل إدارة المدرسة مع تمكينه من فرص التعويض وإشعار ولي الأمر.","إحالة الطالب إلى الموجّه الطلابي لدراسة حالته."],en:["The teacher records the violation in the behaviour log and the student signs it.","The guardian is notified by phone.","One mark is deducted, with recovery opportunities and notification to the guardian.","Referral to the counsellor for case study."]}},
      {t:{ar:"الإجراء الرابع",en:"Fourth procedure"},s:{ar:["دعوة ولي أمر الطالب إلكترونياً وإخطاره بسلوك الطالب غير المرغوب فيه، والاتفاق على خطة لتعديل السلوك بين الأسرة والمدرسة يقوم بها الموجّه الطلابي.","حسم درجة واحدة من درجات السلوك الإيجابي من قبل إدارة المدرسة مع تمكينه من فرص التعويض وإشعار ولي الأمر.","تحويل الطالب إلى لجنة التوجيه الطلابي بالمدرسة لبحث أسباب عدم الاستجابة وإيجاد الحلول المناسبة وفق تقرير دراسة الحالة."],en:["The guardian is summoned electronically and informed; a behaviour plan is agreed and run by the counsellor.","One mark is deducted, with recovery opportunities and notification to the guardian.","Referral to the school guidance committee to examine the lack of response and find suitable solutions per the case report."]}}]},

  {n:2, art:{ar:"المادة (20)",en:"Article 20"}, ded:{ar:"درجتان",en:"2 marks"},
   name:{ar:"الدرجة الثانية",en:"Level Two"},
   v:{ar:["الهروب من الحصة الافتراضية","الإرسال المتعمد لمواد أو روابط ليس لها علاقة بالمحتوى"],
       en:["Absconding from the virtual class","Deliberately sending materials or links unrelated to the content"]},
   p:[{t:{ar:"الإجراء الأول",en:"First procedure"},s:{ar:["تحويل الطالب إلى إدارة المدرسة.","إشعار ولي الأمر هاتفياً بالمشكلة السلوكية والإجراءات المتخذة.","حسم درجتين من درجات السلوك الإيجابي مع تمكينه من فرص التعويض وإشعار ولي الأمر.","إحالة الطالب للموجّه الطلابي لدراسة حالته."],en:["The student is referred to the school administration.","The guardian is notified by phone of the violation and the procedures taken.","Two marks are deducted, with recovery opportunities and notification to the guardian.","Referral to the counsellor for case study."]}},
      {t:{ar:"الإجراء الثاني",en:"Second procedure"},s:{ar:["جميع ما ذُكر في الإجراء الأول مع تغيير إجراءات خطة تعديل السلوك.","دعوة ولي أمر الطالب إلكترونياً ومناقشته خطة تعديل السلوك، ووضع برنامج وقائي مشترك مع الأسرة، وأخذ تعهد خطي على الطالب إلكترونياً بعدم تكرار السلوك، وتوقيع ولي الأمر إلكترونياً بالعلم.","متابعة الحالة من الموجّه الطلابي وتقديم الخدمات التربوية."],en:["Everything in the first procedure, with the behaviour plan revised.","The guardian is summoned electronically; the plan is discussed, a preventive programme is set, the student signs an electronic pledge and the guardian countersigns electronically.","The counsellor follows the case and provides educational services."]}},
      {t:{ar:"الإجراء الثالث",en:"Third procedure"},s:{ar:["جميع ما ذُكر في الإجراء الثاني.","تحويل الطالب إلى لجنة التوجيه الطلابي بالمدرسة لبحث أسباب عدم استجابته لإجراءات تعديل السلوك، وإيجاد الحلول المناسبة وفق تقرير دراسة الحالة."],en:["Everything in the second procedure.","Referral to the school guidance committee to examine the lack of response and find suitable solutions per the case report."]}}]},

  {n:3, art:{ar:"المادة (21)",en:"Article 21"}, ded:{ar:"ثلاث درجات",en:"3 marks"},
   name:{ar:"الدرجة الثالثة",en:"Level Three"},
   v:{ar:["استخدام صور منافية للقيم والذوق العام في حساب الطالب","التلفظ بكلمات نابية على الطلبة أو تهديدهم أو السخرية منهم","كتابة عبارات أو إرسال صور أو مقاطع فيديو مخلّة بالآداب للمعلمين أو للطلبة","التصوير أو التسجيل الصوتي للمعلمين أو للطلبة","إساءة استخدام معلومات الدخول الشخصية في المنصات التعليمية"],
       en:["Using images contrary to public values and decency on the student's account","Foul language toward students, threatening them, or mocking them","Writing indecent statements or sending indecent images or videos to teachers or students","Photographing or audio-recording teachers or students","Misusing personal login credentials on the educational platforms"]},
   p:[{t:{ar:"الإجراء الأول",en:"First procedure"},s:{ar:["تحويل الطالب إلى إدارة المدرسة لاتخاذ ما يلي:","دعوة ولي أمر الطالب إلكترونياً ومناقشته خطة تعديل السلوك، ووضع برنامج علاجي مشترك مع الأسرة، وأخذ تعهد خطي على الطالب إلكترونياً بعدم تكرار السلوك غير المرغوب فيه، وتوقيع ولي الأمر إلكترونياً بالعلم.","حسم ثلاث درجات من درجات السلوك الإيجابي مع تمكينه من فرص التعويض وإشعار ولي الأمر بذلك.","الاعتذار إلى من أُسيء إليهم.","إحالة الطالب إلى الموجّه الطلابي لدراسة حالته."],en:["The student is referred to the school administration, which takes the following:","The guardian is summoned electronically; the behaviour plan is discussed, a joint remedial programme is set with the family, the student signs an electronic pledge not to repeat the behaviour, and the guardian countersigns electronically.","Three marks are deducted, with recovery opportunities and notification to the guardian.","An apology to those wronged.","Referral to the counsellor for case study."]}},
      {t:{ar:"الإجراء الثاني",en:"Second procedure"},s:{ar:["تحويل الطالب إلى إدارة المدرسة لاتخاذ ما يلي:","جميع ما ذُكر في الإجراء الأول.","تحويل الطالب إلى لجنة التوجيه الطلابي لوضع الحلول المناسبة وفقاً لتقرير دراسة الحالة من الموجّه الطلابي.","متابعة الحالة من الموجّه الطلابي، وتقديم الخدمات التربوية."],en:["The student is referred to the school administration, which takes the following:","Everything in the first procedure.","Referral to the guidance committee to set suitable solutions per the counsellor's case report.","The counsellor follows the case and provides educational services."]}}],
   notes:{ar:["تبليغ الجهات الأمنية المختصة فور وقوع المشكلة، بعد إشعار ولي الأمر، وتوثيق الإجراءات المتخذة."],
          en:["Security authorities are notified immediately after the guardian is informed, and every procedure is documented."]}},

  {n:4, art:{ar:"المادة (22)",en:"Article 22"}, ded:{ar:"عشر درجات",en:"10 marks"}, sev:true,
   name:{ar:"الدرجة الرابعة",en:"Level Four"},
   v:{ar:["الإساءة أو الاستهزاء بشيء من شعائر الإسلام","الإساءة للدولة أو رموزها","التنمّر الإلكتروني","التحرش الجنسي الإلكتروني","الجرائم المعلوماتية بكافة أنواعها","المظاهر أو الصور أو الشعارات التي تدل على الشذوذ الجنسي أو الترويج لها"],
       en:["Offending or mocking any of the rites of Islam","Offending the State or its symbols","Cyberbullying","Online sexual harassment","Cybercrimes of all kinds","Displays, images or slogans indicating or promoting sexual deviance"]},
   p:[{t:{ar:"الإجراء (يُطبَّق مباشرة)",en:"Procedure (applied immediately)"},s:{ar:["تُدوّن إدارة المدرسة محضر إثبات الواقعة.","دعوة ولي أمر الطالب إلكترونياً وإشعاره بالمشكلة السلوكية والإجراءات المتخذة.","حسم عشر درجات من درجات السلوك الإيجابي مع تمكينه من فرص التعويض وإشعار ولي الأمر.","تجتمع لجنة التوجيه الطلابي بالمدرسة بعد وقوع المشكلة مباشرة لدراسة ظروفها وملابساتها.","متابعة حالة الطالب من الموجّه الطلابي لتقديم الخدمات التربوية."],
       en:["The school draws up an official incident report.","The guardian is summoned electronically and informed of the violation and the procedures taken.","Ten marks are deducted, with recovery opportunities and notification to the guardian.","The guidance committee convenes immediately after the incident to examine its circumstances.","The counsellor follows the case and provides educational services."]}}],
   notes:{ar:["في حال تصنيف المشكلة ضمن حالات الإيذاء والإهمال أو غير الواردة في النظام، وبعد استنفاد جميع الإجراءات الواردة في الدليل، يتم التواصل مباشرة مع مركز تلقي البلاغات (1919).","تبليغ الجهات الأمنية المختصة فور وقوع المشكلة، بعد إشعار ولي الأمر، وتوثيق الإجراءات المتخذة."],
          en:["If the case falls under abuse or neglect, or is not covered by the rules, and once all procedures are exhausted, the Reporting Centre (1919) is contacted directly.","Security authorities are notified immediately after the guardian is informed, and every procedure is documented."]}}
 ]},

 {id:"esec", ar:"التعليم الإلكتروني — المتوسطة والثانوية", en:"Distance learning — Intermediate & Secondary", levels:[
  {n:1, art:{ar:"المادة (23)",en:"Article 23"}, ded:{ar:"درجة واحدة",en:"1 mark"},

      {t:{ar:"الإجراء الثاني",en:"Second procedure"},s:{ar:["التنبيه الشفهي الثاني من المعلم أو إدارة المدرسة عند مباشرة الموقف بأسلوب تربوي حكيم، وتعزيز السلوك الإيجابي."],en:["A second verbal warning at the moment of the incident, reinforcing the positive behaviour."]}},
      {t:{ar:"الإجراء الثالث",en:"Third procedure"},s:{ar:["تدوين المشكلة السلوكية من المعلم المباشر للموقف، وتوقيع الطالب عليها إلكترونياً.","إشعار ولي أمر الطالب هاتفياً بالمشكلة السلوكية، والتنسيق معه لتعديل السلوك المخالف.","حسم درجة واحدة من درجات السلوك الإيجابي من قبل إدارة المدرسة، مع تمكينه من فرص التعويض وإشعار ولي الأمر بذلك.","إحالة الطالب إلى الموجّه الطلابي لدراسة حالته."],en:["The teacher records the violation and the student signs it electronically.","The guardian is notified by phone and coordinated with to modify the behaviour.","One mark is deducted by the administration, with recovery opportunities and notification to the guardian.","Referral to the counsellor for case study."]}},
      {t:{ar:"الإجراء الرابع",en:"Fourth procedure"},s:{ar:["دعوة ولي أمر الطالب إلكترونياً وإخطاره بسلوك الطالب غير المرغوب فيه، والاتفاق على خطة لتعديل السلوك بين الأسرة والمدرسة يقوم بها الموجّه الطلابي.","حسم درجة من درجات السلوك الإيجابي من قبل إدارة المدرسة، مع تمكينه من فرص التعويض وإشعار ولي الأمر بذلك.","أخذ تعهد إلكتروني على الطالب بعدم تكرار المشكلة.","تحويل الطالب إلى لجنة التوجيه الطلابي بالمدرسة لبحث أسباب عدم استجابته لإجراءات تعديل السلوك، وإيجاد الحلول المناسبة وفق تقرير دراسة الحالة من الموجّه الطلابي.","متابعة الحالة من الموجّه الطلابي، وتقديم الخدمات التربوية."],en:["The guardian is summoned electronically and informed; a behaviour plan is agreed between family and school and run by the counsellor.","One mark is deducted by the administration, with recovery opportunities and notification to the guardian.","The student signs an electronic pledge not to repeat the violation.","Referral to the school guidance committee to examine the lack of response and find suitable solutions per the counsellor's case report.","The counsellor follows the case and provides educational services."]}}]},

   p:[{t:{ar:"الإجراء الأول",en:"First procedure"},s:{ar:["تحويل الطالب إلى إدارة المدرسة.","دعوة ولي أمر الطالب إلكترونياً وتوضيح الإجراءات المترتبة على هذا السلوك حال تكراره، ومناقشته خطة تعديل السلوك، ووضع برنامج وقائي مشترك مع الأسرة، وأخذ تعهد خطي على الطالب إلكترونياً، وتوقيع ولي الأمر إلكترونياً بالعلم.","حسم ثلاث درجات من درجات السلوك الإيجابي مع تمكينه من فرص التعويض وإشعار ولي الأمر.","الاعتذار إلى من أُسيء إليهم.","إحالة الطالب إلى الموجّه الطلابي لدراسة الحالة ومتابعتها لتقديم الخدمات التربوية."],en:["The student is referred to the school administration.","The guardian is summoned electronically and told what a repeat entails; the plan is discussed, a preventive programme is set, the student signs an electronic pledge and the guardian countersigns electronically.","Three marks are deducted, with recovery opportunities and notification to the guardian.","An apology to those wronged.","Referral to the counsellor for case study and follow-up."]}},
      {t:{ar:"الإجراء الثاني",en:"Second procedure"},s:{ar:["تنفيذ جميع ما ذُكر في الإجراء الأول.","تحويل الطالب إلى لجنة التوجيه الطلابي لوضع الحلول المناسبة وفقاً لتقرير دراسة الحالة من الموجّه الطلابي."],en:["Everything in the first procedure.","Referral to the guidance committee to set suitable solutions per the counsellor's case report."]}}]},

  {n:4, art:{ar:"المادة (26)",en:"Article 26"}, ded:{ar:"عشر درجات",en:"10 marks"}, sev:true,
   name:{ar:"الدرجة الرابعة",en:"Level Four"},
   v:{ar:["كتابة عبارات أو إرسال صور أو مقاطع فيديو مخلّة بالآداب للمعلمين أو لزملائه من الطلبة","التصوير أو التسجيل الصوتي للمعلمين أو للطلبة"],
       en:["Writing indecent statements or sending indecent images or videos to teachers or fellow students","Photographing or audio-recording teachers or students"]},
   p:[{t:{ar:"الإجراء الأول",en:"First procedure"},s:{ar:["تحويل الطالب إلى إدارة المدرسة.","دعوة ولي أمر الطالب إلكترونياً وتوضيح الإجراءات المترتبة حال التكرار، ومناقشة خطة تعديل السلوك، ووضع برنامج وقائي مشترك مع الأسرة، وأخذ تعهد خطي إلكترونياً على الطالب، وتوقيع ولي الأمر إلكترونياً بالعلم.","حسم عشر درجات من درجات السلوك الإيجابي مع تمكينه من فرص التعويض لتعديل سلوكه وتعويض الدرجات المحسومة، وإشعار ولي أمره.","الاعتذار لمن أُسيء إليهم.","إحالة الطالب إلى الموجّه الطلابي لدراسة حالته ومتابعتها لتقديم الخدمات التربوية."],en:["The student is referred to the school administration.","The guardian is summoned electronically and told what a repeat entails; the plan is discussed, a preventive programme is set, the student signs an electronic pledge and the guardian countersigns electronically.","Ten marks are deducted, with opportunities to modify the behaviour and recover the marks, and the guardian is informed.","An apology to those wronged.","Referral to the counsellor for case study and follow-up."]}},
      {t:{ar:"الإجراء الثاني",en:"Second procedure"},s:{ar:["تنفيذ جميع ما ذُكر في الإجراء الأول مع تغيير إجراءات خطة تعديل السلوك.","تحويل الطالب إلى لجنة التوجيه الطلابي لوضع الحلول المناسبة وفقاً لتقرير دراسة الحالة من الموجّه الطلابي."],en:["Everything in the first procedure, with the behaviour plan revised.","Referral to the guidance committee to set suitable solutions per the counsellor's case report."]}}],
   notes:{ar:["تبليغ الجهات الأمنية المختصة فور وقوع المشكلة، بعد إشعار ولي الأمر، وتوثيق الإجراءات المتخذة."],

 marks:{
  ar:{h:"الدرجات وتقييمها",
      conduct:"تقييم السلوك", attend:"تقييم المواظبة",
      c:["يُعد السلوك مادة مستقلة تعكس مخرجات تعليم الطالب من النواحي الأخلاقية، وتُحسب درجته ضمن المعدل الدراسي الفصلي من الصف الثالث الابتدائي إلى الثالث الثانوي.","السلوك الإيجابي (80%): هو السلوك المتوقع من جميع الطلبة دون ارتكاب مشكلات سلوكية، ويُعد كل طالب مستحقاً لـ80 درجة تلقائياً في بداية كل فصل دراسي.","السلوك المتميز (20%): يعكس الممارسات المتسقة مع القيم الإسلامية والهوية الوطنية، ويُقيَّم ضمن ممارسات السلوك المتميز الموضحة في القواعد.","الصفان الأول والثاني الابتدائي: تقدير كيفي بعبارات لفظية دقيقة وموضوعية مبنية على شواهد وأدلة.","تُتاح للطالب فرص تعويض الدرجات المحسومة خلال الفصل الدراسي، ويحق له الجمع بين الفرص، على ألا تتجاوز درجات السلوك 100 درجة.","يقدّم الطالب الشواهد التي تثبت قيامه بفرصة تعويضية لوكيل شؤون الطلبة، ويُحتفظ بها في ملفه.","تُدوَّن درجة السلوك في حقل خاص بها ضمن بطاقة الدرجات، ويُعد هذا الحقل جزءاً لا يتجزأ من أي كشف درجات تصدره المدرسة."],
      a:["تُخصص 100 درجة للمواظبة خلال العام الدراسي من الصف الثالث الابتدائي إلى الثالث الثانوي، بوزن نسبي يعادل خمس حصص أسبوعياً.","يُحسم درجة واحدة عن غياب كل يوم دراسي بدون عذر.","حرمان الطالب من الانتقال في حال تجاوز نسبة غيابه بدون عذر 10% خلال العام: الابتدائية والمتوسطة من الانتقال إلى العام التالي، والثانوية من الانتقال إلى الفصل التالي.","يُدخل الغياب يومياً من قبل إدارة المدرسة في المنصات المعتمدة (نظام نور – منصة مدرستي).","الصفان الأول والثاني الابتدائي: تقدير كيفي.","تُدوَّن درجة المواظبة في حقل خاص ضمن بطاقة الدرجات وتُحتسب ضمن المعدل الفصلي."],
      bonusT:"ممارسات السلوك المتميز والدرجات المستحقة",

  en:{h:"Marks and assessment",

      c:["Conduct is an independent subject reflecting the ethical outcomes of a student's education. It counts toward the term average from Grade 3 (primary) to Grade 12 (secondary).","Positive conduct (80%): the behaviour expected of every student in the absence of violations. Every student is credited with 80 marks automatically at the start of each term.","Distinguished conduct (20%): practices consistent with Islamic values and national identity, assessed against the listed distinguished-conduct practices.","Grades 1 and 2 (primary): qualitative assessment using precise, objective statements based on evidence.","Deducted marks may be recovered during the term, and opportunities may be combined, provided conduct marks do not exceed 100.","The student submits evidence of any recovery opportunity to the student affairs deputy, and it is kept in their file.","The conduct mark is recorded in a dedicated field on the report card, and that field is an inseparable part of any grade sheet the school issues."],
      a:["100 marks are allocated to attendance across the year from Grade 3 to Grade 12, weighted equivalent to five class periods per week.","One mark is deducted for each school day of unexcused absence.","A student is denied promotion if unexcused absence exceeds 10% of the year: primary and intermediate to the next year, secondary to the next term.","Absence is entered daily by the school on the approved platforms (Noor system, Madrasati).","Grades 1 and 2 (primary): qualitative assessment.","The attendance mark is recorded in a dedicated field on the report card and counts toward the term average."],

 general:{
  ar:{h:"الأحكام العامة للسلوك", lead:"أبرز ما نصّت عليه المادة (28) من أحكام تحكم تطبيق الإجراءات.",
      items:["الالتزام بالتدرج في تنفيذ إجراءات المشكلات السلوكية كما ورد في القواعد.","تطبيق الإجراء التالي مباشرة عند تكرار الطالب لنفس المشكلة السلوكية.","اتخاذ إجراءات المشكلة الأعلى درجة عند ارتكاب الطالب أكثر من مشكلة سلوكية في وقت واحد.","مراعاة مناسبة الإجراء للمرحلة العمرية للطالب والظروف التي أدت إلى الوقوع في المشكلة.","تنفيذ برامج علاجية تربوية مناسبة في المدرسة تزامناً مع الإجراءات المتخذة.","إبلاغ إدارة المدرسة ولي أمر الطالب بما اتُخذ من إجراءات.","توثيق رفض الطالب أو ولي أمره التعهد بعدم تكرار المشكلة، مع الاستمرار في بقية الإجراءات.","عدم إشراك الموجّه الطلابي في رصد درجات السلوك ولا في تنفيذ الإجراءات، ويكتفي بدوره بعد التنفيذ بدراسة الحالة وعلاجها.","استدعاء الجهات الأمنية بعد إبلاغ ولي الأمر، وفي حال عدم حضوره تُنفَّذ الإجراءات بحضوره أو بدونه مع إبلاغ مركز الحماية وتوثيق ذلك.","إحالة وضع الطالب إلى إدارة التعليم بعد استنفاد المدرسة لجميع الإجراءات في الدرجات الأولى والثانية والثالثة، مع تمكينه من الاستمرار بالدراسة حتى صدور القرار.","إعادة الطالب إلى مدرسته السابقة بعد قرار النقل إذا أمضى فصلاً دراسياً على الأقل وأبدى هو أو ولي أمره رغبة في العودة وتحقق تحسّن في سلوكه.","تأجيل قرار النقل إلى بداية الفصل الدراسي القادم إذا ارتكب المشكلة خلال الأسبوع الأخير من الدراسة أو أثناء الاختبارات النهائية.","تعويض الطالب درجة السلوك المحسومة لا يعفيه من تنفيذ بقية إجراءات المشكلة السلوكية.","إتاحة فرص التعويض حتى نهاية العام الدراسي لمن ارتكب مشكلة قبل أسبوع من الاختبارات النهائية أو أثنائها.","تطبيق الإجراءات المنظمة للاختبارات الواردة في لائحة تقويم الطالب عند ارتكاب مخالفة الغش.","التعامل مع مخالفة الطالب من ذوي الإعاقة ضمن برامج الدمج من قبل لجنة التوجيه الطلابي بالتنسيق مع قسم ذوي الإعاقة في إدارة التعليم.","الحفاظ على سرية معلومات الطالب المخالف سلوكياً والإجراءات المتخذة بحقه.","استثناء الطلبة الذين يثبت تعرضهم للإيذاء من بعض الإجراءات إذا ثبت أن تطبيقها يشكل تهديداً لسلامتهم النفسية أو الجسدية.","تزويد المدرسة المنتقل إليها الطالب بتقرير عن سلوكه، وإنفاذ الحسم المطبق سابقاً مع إتاحة الفرصة لتحسين درجاته، والبدء بالتعامل معه من الإجراء الأول عند أي مخالفة جديدة."],
      banT:"ممارسات غير تربوية يُمنع على المدرسة اللجوء إليها",
      ban:["الإيذاء الجسدي أو النفسي بجميع أنواعه.","التسبب في انقطاع الطالب عن العملية التعليمية.","حرمان الطالب من وجبة الإفطار في وقتها.","تكليف الطالب بنسخ الواجب المدرسي عدة مرات كعقاب.","استفزاز الطالب ودفعه إلى ارتكاب السلوك الخاطئ أو الغياب عن المدرسة.","السخرية والاستهزاء بشخصية الطالب.","إقصاء الطالب خارج الصف الدراسي."]},
  en:{h:"General provisions", lead:"The key provisions of Article 28 governing how procedures are applied.",
      items:["Procedures must be applied in the graduated order set out in the rules.","The next procedure applies immediately when the same violation is repeated.","Where several violations occur at once, the procedure for the highest level applies.","The procedure must suit the student's age and the circumstances that led to the violation.","Suitable remedial educational programmes run in parallel with the procedures taken.","The school informs the guardian of every procedure taken.","A refusal by the student or guardian to sign the pledge is documented, and the remaining procedures continue.","The counsellor takes no part in recording conduct marks or carrying out procedures; their role begins afterwards, with case study and remediation.","Security authorities are called after the guardian is informed; if the guardian does not attend, procedures are carried out either way, the protection centre is informed, and everything is documented.","The case is escalated to the Education Directorate once the school has exhausted all procedures at Levels One to Three; the student continues attending until a decision is issued.","A transferred student may return to their previous school after at least one term if they or their guardian request it and improvement is verified.","A transfer decision is postponed to the start of the next term if the violation occurred in the last week of study or during final examinations.","Recovering a deducted mark does not exempt the student from the remaining procedures.","A student who offends within a week of final examinations, or during them, may recover marks until the end of the year.","Examination rules in the Student Assessment Regulation apply to cheating offences.","Violations by students with disabilities in inclusion programmes are handled by the guidance committee in coordination with the disability department at the Education Directorate.","The student's information and the procedures taken are kept confidential.","Students proven to have suffered abuse are exempted from procedures that would threaten their psychological or physical safety.","The receiving school is given a conduct report; previous deductions stand, the student is given the chance to improve, and any new violation restarts at the first procedure."],
      banT:"Practices the school must not resort to",
      ban:["Physical or psychological harm of any kind.","Causing the student to be cut off from the educational process.","Denying the student breakfast at its designated time.","Assigning repeated copying of homework as punishment.","Provoking the student into misbehaving or into being absent.","Mocking or ridiculing the student's character.","Excluding the student from the classroom."]}},
